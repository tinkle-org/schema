name: docs-build

# On merges to main: regenerate the docs content (reference + synced
# guides), validate it, and notify the consuming website
# (tinkle-org/tinkle-website-nextjs) via a `repository_dispatch` so it can
# rebuild and re-validate the site with fresh schema docs.
#
# The website renders this content with Nextra at https://tinkle.me/schema/;
# the content itself is generated by this repo at website-build time — this
# workflow publishes nothing.

on:
  push:
    branches: [main]
    paths:
      - 'tinkle/**'
      - 'buf.yaml'
      - 'buf.lock'
      - 'website/**'
      - 'REALTIME.md'
      - 'conformance/realtime.md'
      - '.github/workflows/docs-*.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate and validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
      - name: Generate content
        working-directory: website
        run: npm run generate
      - name: Validate internal links
        working-directory: website
        run: npm run check
      - name: Verify deterministic output
        working-directory: website
        run: |
          hash_a=$(find content -type f -not -path '*/node_modules/*' | sort | xargs cat | shasum -a 256 | cut -d' ' -f1)
          npm run generate
          hash_b=$(find content -type f -not -path '*/node_modules/*' | sort | xargs cat | shasum -a 256 | cut -d' ' -f1)
          if [ "$hash_a" != "$hash_b" ]; then
            echo "::error::Generated content is not deterministic"
            exit 1
          fi
      # GITHUB_TOKEN-initiated events do not trigger workflows in the target
      # repo, so the dispatch needs a PAT (RELEASE_PLEASE_TOKEN is used by
      # release-please.yaml and works here too). Without it, skip the
      # notification: the website picks up the content on its next image
      # build either way.
      - name: Notify website repository
        if: github.repository == 'tinkle-org/tinkle-proto'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::RELEASE_PLEASE_TOKEN not set — skipping website dispatch"
            exit 0
          fi
          gh api \
            --method POST \
            repos/tinkle-org/tinkle-website-nextjs/dispatches \
            -f event_type=schema-docs-updated \
            -F "client_payload[sha]=$SHA" \
            --hostname github.com
