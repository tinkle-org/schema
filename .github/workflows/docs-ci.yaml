name: docs-ci

# PR validation for the schema docs content. Regenerates the reference
# from the protobuf descriptor set, verifies the output is deterministic,
# and checks that every internal /schema/... link resolves to a real
# content page. The rendering itself is validated by the consuming
# website (tinkle-org/tinkle-website-nextjs).

on:
  pull_request:
    branches: [main]
    paths:
      - 'tinkle/**'
      - 'buf.yaml'
      - 'buf.lock'
      - 'website/**'
      - 'REALTIME.md'
      - 'conformance/realtime.md'
      - '.github/workflows/docs-*.yaml'

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Generate and validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
      - name: Generate content
        working-directory: website
        run: npm run generate
      - name: Validate internal links
        working-directory: website
        run: npm run check
      - name: Verify deterministic output
        working-directory: website
        run: |
          hash_a=$(find content -type f -not -path '*/node_modules/*' | sort | xargs cat | shasum -a 256 | cut -d' ' -f1)
          npm run generate
          hash_b=$(find content -type f -not -path '*/node_modules/*' | sort | xargs cat | shasum -a 256 | cut -d' ' -f1)
          if [ "$hash_a" != "$hash_b" ]; then
            echo "::error::Generated content is not deterministic"
            exit 1
          fi
