name: buf-ci

# Trunk-based publishing: PRs validate only, merges to main publish.
# On pull_request the action runs build, lint, format, breaking plus
# a summary comment and never touches the BSR. On push to main it runs
# build plus buf push, publishing every named module with matching
# Git metadata so other repos can test against BSR commits and the
# moving main label. Tag pushes (v*) publish version labels when they
# trigger this workflow; release-please.yaml also ensures the version
# label for GITHUB_TOKEN-created or paths-filtered tags. Delete events
# archive the matching BSR labels.
#
# Consumers (Go/Rust) test unreleased changes via BSR commits/main:
#   Go:   go get buf.build/gen/go/tinkle-org/schema/protocolbuffers/go@main
#   Rust: cargo add --registry buf tinkle-org_schema_bufbuild_community_tonic-prost
# Formal versions remain Git tags + release-please releases.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'tinkle/**'
      - 'buf.yaml'
      - 'buf.lock'
      - 'LICENSE'
      - 'README.md'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          push_create_visibility: public
