name: buf-ci

# Validates the proto source on every PR and push (build, lint, format,
# breaking; PR summary comments included). This workflow does NOT publish:
# publication to the Buf Schema Registry is release-gated and handled by
# release-please.yaml when a Release PR merge creates a tagged release.
#
# Consumers (Go/Rust) get SDK updates via published releases:
#   Go:   go get buf.build/gen/go/tinklecorp/tinkle-proto/{protocolbuffers,grpc}/go
#   Rust: cargo add --registry buf tinklecorp_tinkle-proto_bufbuild_community_tonic-prost
#
# BUF_TOKEN is used by release-please.yaml (not this workflow).

on:
  push:
    branches: [main]
    paths:
      - 'tinkle/**'
      - 'buf.yaml'
      - 'buf.lock'
      - 'LICENSE'
      - 'README.md'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          push: false
          push_create_visibility: public
