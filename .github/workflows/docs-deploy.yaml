name: docs-deploy

# Deploys the schema documentation site to GitHub Pages on every merge
# to main. Publishes independently of the Next.js website; production
# URLs are derived from GITHUB_REPOSITORY (or DOCUSAURUS_URL for a
# custom domain).
#
# One-time setup (Settings → Pages): set "Build and deployment" source
# to "GitHub Actions". For a custom domain, configure the repository
# Pages domain plus DNS, then set DOCUSAURUS_URL / DOCUSAURUS_BASE_URL
# build environment in the docusaurus.config.ts hosting notes.

on:
  push:
    branches: [main]
    paths:
      - 'tinkle/**'
      - 'buf.yaml'
      - 'buf.lock'
      - 'website/**'
      - 'REALTIME.md'
      - 'conformance/realtime.md'
      - '.github/workflows/docs-*.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build site (includes reference generation)
        working-directory: website
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
