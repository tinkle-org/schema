name: conformance

# Schema/codec conformance checks (pure Python, no bindings). Compares
# declarations against origin/main plus the pinned pre-media-change revision,
# pins names/types/presence/methods while allowing the intentional global tag
# reset, checks compact numbering/no reservations, and exercises Buf codecs.
# This is independent of buf-ci (which owns lint/format/breaking/publish) so
# the suites can evolve separately. On main pushes, origin/main equals HEAD,
# so that comparison becomes an internal-consistency check; the pinned media
# baseline continues checking the exact RPC additions and allowed removals.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tinkle/**'
      - 'conformance/**'
      - 'buf.yaml'
      - 'buf.lock'

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Schema and codec checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Baseline comparison builds declarations from origin/main.
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Pinned so codec round trips stay reproducible: the suite asserts
          # protojson emission details. Keep in sync with local Buf.
          version: '1.59.0'
      - name: Run conformance suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s conformance -p 'test_*.py' -v
