syntax = "proto3";

package tinkle.v1;

import "tinkle/v1/message_types.proto";

option go_package = "github.com/tinklehq/tinkle-proto/tinkle/v1;tinklev1";

// Owner-only hint to refetch GetMyBoosts, not a command receipt. Coalesce hints
// by highest revision for this owner and environment. Ignore snapshots older than
// the applied snapshot. If a newer hint arrives during a read, refetch unless
// the returned revision covers it.
// On startup or reconnect, read GetMyBoosts and GetBoostConfiguration.
message MyBoostsChanged {
  // Positive owner revision at the change, not a write precondition.
  uint64 revision = 1;
}

// Invalidation for current members allowed to read this room's boost status.
// A move invalidates both rooms separately; neither hint identifies the other room.
// Coalesce hints by highest revision for this room and environment. Ignore snapshots
// older than the applied snapshot. If a newer hint arrives during a read, refetch
// unless the returned revision covers it.
// On startup or reconnect, read GetBoostStatus for each displayed room and restart
// any displayed ListBoosts or GetUserBoosts reads under current authorization.
message BoostStatusChanged {
  // Only the affected, currently disclosable room. Refetch GetBoostStatus there.
  RoomQueryTarget target = 1;
  // Positive room revision; also invalidates contributor reads for this room.
  uint64 revision = 2;
}
