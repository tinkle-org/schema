// Account RPC Service - Client-Facing Aggregator Layer.
//
// Aggregator service between rpc-gateway and core services.
// Provides authenticated user account operations by orchestrating
// notification-service, user-service, username-service, and identity-service.
syntax = "proto3";

package tinkle.v1;

import "google/protobuf/timestamp.proto";
import "tinkle/v1/common.proto";
import "tinkle/v1/media.proto";

option go_package = "github.com/tinklehq/tinkle-proto/tinkle/v1;tinklev1";

// AccountService provides authenticated user account operations.
//
// All methods require an active device-key-authenticated session with user context.
// User ID is derived from the session, not passed in requests.
service AccountService {
  // RegisterPush registers a device for push notifications.
  // Returns the registered device on success.
  // Returns INVALID_ARGUMENT if token or lang_code is invalid.
  rpc RegisterPush(RegisterPushRequest) returns (RegisterPushResponse);

  // UnregisterPush removes a device from push notifications.
  // Returns NOT_FOUND if device does not exist.
  rpc UnregisterPush(UnregisterPushRequest) returns (UnregisterPushResponse);

  // GetNotificationSettings retrieves all notification settings for the user.
  // Returns empty list if user has no settings configured.
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse);

  // UpdateNotificationSetting updates a notification setting for a scope.
  // Creates the setting if it doesn't exist.
  rpc UpdateNotificationSetting(UpdateNotificationSettingRequest) returns (UpdateNotificationSettingResponse);

  // ResetNotificationSettings resets all notification settings to defaults.
  // Sets enabled=true, preview=true on all scopes.
  rpc ResetNotificationSettings(ResetNotificationSettingsRequest) returns (ResetNotificationSettingsResponse);

  // GetPrivacy retrieves a specific privacy setting by kind.
  rpc GetPrivacy(GetPrivacyRequest) returns (GetPrivacyResponse);

  // SetPrivacy updates a privacy setting for a specific kind.
  // Creates the setting if it doesn't exist.
  rpc SetPrivacy(SetPrivacyRequest) returns (SetPrivacyResponse);

  // UpdateProfile updates the user's profile (name, about).
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // ValidateUsername checks if a username is valid and available.
  rpc ValidateUsername(ValidateUsernameRequest) returns (ValidateUsernameResponse);

  // UpdateUsername assigns or changes the user's username.
  // Returns ALREADY_EXISTS if username is taken.
  // Returns INVALID_ARGUMENT if format is invalid.
  rpc UpdateUsername(UpdateUsernameRequest) returns (UpdateUsernameResponse);

  // DeleteAccount soft-deletes the user's account.
  // Auto-assigns group/channel ownership to oldest admin or dissolves if last owner.
  // Triggers cleanup of push registrations and notification settings.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // SendChangePhoneCode initiates verification for a new phone number.
  // Returns ALREADY_EXISTS if phone number is already registered to another user.
  rpc SendChangePhoneCode(SendChangePhoneCodeRequest) returns (SendChangePhoneCodeResponse);

  // ChangePhoneNumber completes the phone number change with verification code.
  // Returns INVALID_ARGUMENT if code is incorrect or expired.
  rpc ChangePhoneNumber(ChangePhoneNumberRequest) returns (ChangePhoneNumberResponse);

  // GetContentSettings retrieves the user's content settings.
  rpc GetContentSettings(GetContentSettingsRequest) returns (GetContentSettingsResponse);

  // SetContentSetting toggles content scope settings.
  // For each scope: if enabled, disables it; if disabled, enables it.
  rpc SetContentSetting(SetContentSettingRequest) returns (SetContentSettingResponse);

  // Logout invalidates the current session and cancels its staged replacements.
  // The session UUID and exact key binding come from trusted connection context.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // RevokeSession invalidates a specific session by its ID.
  // The target must be another device of the authenticated account; use Logout
  // for the current device. Revocation also cancels its staged replacements.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // RevokeSessions invalidates every other device session of the current account
  // and their staged replacements, preserving the caller's current session.
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);

  // GetSessions lists active device sessions for the authenticated account.
  // Returns a complete, consistent snapshot, including pending login reviews.
  // Staged, revoked, and expired sessions do not appear as active devices.
  // Refresh on SessionChanged notifications and on startup or reconnect;
  // notifications are hints, not an authoritative session list or access grant.
  rpc GetSessions(GetSessionsRequest) returns (GetSessionsResponse);

  // ConfirmSession records that the user recognizes another active device's
  // login. The target must belong to the authenticated account and must not be
  // the caller's current session. The caller must already be confirmed; two
  // unconfirmed sessions cannot confirm each other. Review is account-wide,
  // not per observer. Check caller authorization and confirmed state atomically
  // with the target transition at the effect boundary.
  // Unconfirmed sessions already have account access; confirmation neither
  // activates a key nor extends its lifetime or prevents later revocation.
  // Reconfirming an already-confirmed active target succeeds. Confirmation and
  // revocation must serialize: confirmation never restores a revoked session.
  // Returns INVALID_ARGUMENT for a malformed session UUID, FAILED_PRECONDITION
  // for an unconfirmed caller or the current session, and NOT_FOUND for unknown,
  // foreign, or inactive targets without distinguishing those cases.
  rpc ConfirmSession(ConfirmSessionRequest) returns (ConfirmSessionResponse);

  // SetProfilePhoto validates a completed-file source, appends it to the caller's
  // gallery, and selects it atomically. The gallery holds at most 10 photos;
  // a full gallery rejects insertion rather than silently evicting photos.
  rpc SetProfilePhoto(SetProfilePhotoRequest) returns (SetProfilePhotoResponse);
  // GetProfilePhotos returns the complete bounded gallery for self; for another
  // user it returns only the selected photo if current photo privacy permits it.
  rpc GetProfilePhotos(GetProfilePhotosRequest) returns (GetProfilePhotosResponse);
  // SelectProfilePhoto selects an existing caller-owned gallery entry.
  rpc SelectProfilePhoto(SelectProfilePhotoRequest) returns (SelectProfilePhotoResponse);
  // DeleteProfilePhoto removes a caller-owned gallery entry, not its stored file.
  // Deleting the selected entry clears selection; no older photo is auto-selected.
  rpc DeleteProfilePhoto(DeleteProfilePhotoRequest) returns (DeleteProfilePhotoResponse);
}

// PushDevice represents a registered push notification device.
message PushDevice {
  // Platform-specific push token.
  string token = 1;
  // Token type.
  PushTokenType type = 2;
  // Language code.
  string lang_code = 3;
  // When the device was registered.
  google.protobuf.Timestamp registered_at = 4;
}

// NotificationSetting represents preferences for a notification scope.
message NotificationSetting {
  // Scope (USERS, GROUPS, CHANNELS).
  NotificationScope scope = 1;
  // Whether notifications are enabled (optional to distinguish false from unset).
  optional bool enabled = 2;
  // Whether message previews are shown (optional to distinguish false from unset).
  optional bool preview = 3;
  // Custom notification sound (empty = default).
  string sound = 4;
}

// PrivacySetting represents a privacy preference with optional rules.
message PrivacySetting {
  // The privacy kind this setting applies to.
  PrivacyKind kind = 1;
  // Who can see the user's information for this kind.
  PrivacyAllowValue allow_value = 2;
  // Exception rules for specific target users.
  repeated PrivacyRule rules = 3;
}

// PrivacyRule represents an exception rule for a specific target user.
message PrivacyRule {
  int64 target_id = 1;
  PrivacyRuleAction action = 2;
}

// PrivacyRuleInput is used when setting privacy rules.
message PrivacyRuleInput {
  int64 target_id = 1;
  PrivacyRuleAction action = 2;
}

// Profile represents user profile information.
message Profile {
  string name = 1;
  string about = 2;
}

// Username represents an assigned username.
message Username {
  string username = 1;
  google.protobuf.Timestamp assigned_at = 2;
}

// ContentSettings represents content visibility preferences.
message ContentSettings {
  // List of enabled content scopes.
  repeated ContentScope scopes = 1;
}

// =============================================================================
// RegisterPush RPC
// =============================================================================

// RegisterPushRequest contains device registration data.
message RegisterPushRequest {
  // Platform-specific push token.
  string token = 1;
  // Token type (APNS, APNS_VOIP, FCM).
  PushTokenType type = 2;
  // ISO 639-1 language code for localized notifications.
  string lang_code = 3;
}

// RegisterPushResponse returns the registered device.
message RegisterPushResponse {
  // The registered push device.
  PushDevice device = 1;
}

// UnregisterPushRequest identifies a device to unregister.
message UnregisterPushRequest {
  // Push token to unregister.
  string token = 1;
}

// UnregisterPushResponse confirms device removal.
message UnregisterPushResponse {
  // True if the device was removed.
  bool removed = 1;
}

// =============================================================================
// Notification Settings RPCs
// =============================================================================

// GetNotificationSettingsRequest is empty; identity comes from trusted session context.
message GetNotificationSettingsRequest {}

// GetNotificationSettingsResponse contains the user's notification settings.
message GetNotificationSettingsResponse {
  // List of notification settings.
  repeated NotificationSetting settings = 1;
}

// UpdateNotificationSettingRequest contains setting updates.
message UpdateNotificationSettingRequest {
  // Scope to update.
  NotificationScope scope = 1;
  // New enabled value (optional).
  optional bool enabled = 2;
  // New preview value (optional).
  optional bool preview = 3;
  // New sound value (optional).
  optional string sound = 4;
}

// UpdateNotificationSettingResponse returns the updated setting.
message UpdateNotificationSettingResponse {
  // The updated notification setting.
  NotificationSetting setting = 1;
}

// ResetNotificationSettingsRequest is empty - resets all for user.
message ResetNotificationSettingsRequest {}

// ResetNotificationSettingsResponse returns the reset settings list.
message ResetNotificationSettingsResponse {
  // The reset notification settings.
  repeated NotificationSetting settings = 1;
}

// =============================================================================
// Privacy RPCs
// =============================================================================

// GetPrivacyRequest requests a specific privacy setting by kind.
message GetPrivacyRequest {
  // The privacy kind to retrieve.
  PrivacyKind kind = 1;
}

// GetPrivacyResponse returns the privacy setting.
message GetPrivacyResponse {
  // The privacy setting for the requested kind.
  PrivacySetting setting = 1;
}

// SetPrivacyRequest contains privacy update data.
message SetPrivacyRequest {
  // The privacy kind to update.
  PrivacyKind kind = 1;
  // The new allow value.
  PrivacyAllowValue allow_value = 2;
  // Full list of privacy rules (replaces existing rules).
  repeated PrivacyRuleInput rules = 3;
}

// SetPrivacyResponse returns the updated privacy setting.
message SetPrivacyResponse {
  // The updated privacy setting.
  PrivacySetting setting = 1;
}

// =============================================================================
// Profile RPCs
// =============================================================================

// UpdateProfileRequest contains profile update data.
message UpdateProfileRequest {
  // Display name (max 100 chars).
  optional string name = 1;
  // About/bio text (max 500 chars).
  optional string about = 2;
}

// UpdateProfileResponse returns the updated profile.
message UpdateProfileResponse {
  // The updated profile.
  Profile profile = 1;
}

// =============================================================================
// Username RPCs
// =============================================================================

// ValidateUsernameRequest contains the username to validate.
message ValidateUsernameRequest {
  // Username to check (5-32 chars, alphanumeric + underscore).
  string username = 1;
}

// ValidateUsernameResponse indicates the validation result.
message ValidateUsernameResponse {
  // True if the format is valid.
  bool valid = 1;
  // True if available for assignment.
  bool available = 2;
  // Reason if invalid (empty if valid).
  string reason = 3;
}

// UpdateUsernameRequest contains the new username.
message UpdateUsernameRequest {
  // Username to assign.
  string username = 1;
}

// UpdateUsernameResponse returns the assigned username.
message UpdateUsernameResponse {
  // The assigned username.
  Username username = 1;
}

// =============================================================================
// Account Deletion RPCs
// =============================================================================

// DeleteAccountRequest is empty - deletes the current user's account.
message DeleteAccountRequest {}

// DeleteAccountResponse confirms account deletion.
message DeleteAccountResponse {
  // True if the account was deleted.
  bool deleted = 1;
}

// =============================================================================
// Phone Number Change RPCs
// =============================================================================

// SendChangePhoneCodeRequest contains the new phone number.
message SendChangePhoneCodeRequest {
  // New phone number in E.164 format.
  string phone_number = 1;
  // Language code for SMS content.
  string lang_code = 2;
}

// SendChangePhoneCodeResponse confirms code delivery.
message SendChangePhoneCodeResponse {
  // Deprecated alias for verification_id. Do not log this value.
  string request_id = 1 [deprecated = true];
  // When the code expires.
  google.protobuf.Timestamp expires_at = 2;
  // Opaque verification flow identifier to retain on the client and return
  // unchanged in ChangePhoneNumberRequest.verification_id. Do not log it.
  string verification_id = 3;
}

// ChangePhoneNumberRequest contains the new phone and verification code.
message ChangePhoneNumberRequest {
  // New phone number in E.164 format.
  string phone_number = 1;
  // Verification code received via SMS.
  string code = 2;
  // Required identifier returned by SendChangePhoneCodeResponse.verification_id.
  // Bound to the new phone_number; grants no account access.
  string verification_id = 3;
}

// ChangePhoneNumberResponse confirms the phone number change.
message ChangePhoneNumberResponse {
  // New phone number (confirmed).
  string phone_number = 1;
}

// =============================================================================
// Content Settings RPCs
// =============================================================================

// GetContentSettingsRequest is empty; identity comes from trusted session context.
message GetContentSettingsRequest {}

// GetContentSettingsResponse returns the content settings.
message GetContentSettingsResponse {
  // The user's content settings.
  ContentSettings settings = 1;
}

// SetContentSettingRequest contains scopes to toggle.
message SetContentSettingRequest {
  // Scopes to toggle.
  repeated ContentScope scopes = 1;
}

// SetContentSettingResponse returns the updated content settings.
message SetContentSettingResponse {
  // The updated content settings.
  ContentSettings settings = 1;
}

// =============================================================================
// Session Management RPCs
// =============================================================================

// LogoutRequest is empty; the current device session comes from trusted context.
message LogoutRequest {}

// LogoutResponse confirms the current session was invalidated.
message LogoutResponse {
  // True if the current session was invalidated.
  bool logged_out = 1;
}

// RevokeSessionRequest identifies the session to invalidate.
message RevokeSessionRequest {
  // Neutral device-session UUID to revoke; not a credential or key handle.
  string session_id = 1;
}

// RevokeSessionResponse confirms the session was invalidated.
message RevokeSessionResponse {
  // True if the session was invalidated.
  bool revoked = 1;
}

// RevokeSessionsRequest is empty; revoke other devices of the current account.
message RevokeSessionsRequest {}

// RevokeSessionsResponse confirms all other device sessions were invalidated.
message RevokeSessionsResponse {
  // True once every other device session and its staged replacements are revoked.
  bool revoked = 1;
}

// Session represents one active device session for an account. It contains no
// authorization key or provider credential and remains stable across rotations.
// Review state is separate from key activation: unconfirmed sessions have
// ordinary account access but cannot confirm other sessions.
message Session {
  // Neutral device-session UUID for display, review, and revocation; not a credential.
  string id = 1;
  // Device model reported by the client (e.g. "iPhone 15 Pro").
  string device_model = 2;
  // Client platform (e.g. "ios", "android", "web").
  string platform = 3;
  // Operating system version reported by the client.
  string system_version = 4;
  // Application (client) version reported by the client.
  string app_version = 5;
  // Unix epoch timestamp (seconds) when the session was created.
  int64 created_date = 6;
  // Unix epoch timestamp (seconds) of the last activity on the session.
  int64 active_date = 7;
  // IP address of the session, used to derive country and region.
  string ip = 8;
  // Country code derived from ip (e.g. "US"), empty if unknown.
  string country = 9;
  // Region derived from ip (e.g. "CA"), empty if unknown.
  string region = 10;
  // True if this is the session that issued the current request.
  bool current = 11;
  // Client-reported application build identifier captured at sign-in (e.g. "142").
  // Empty when unknown; descriptive only, not an authentication signal.
  string app_build = 12;
  // True until another active, confirmed session of the account confirms this
  // login, or this session is revoked or expires. No timeout confirms it.
  // Set once when a new device session first becomes ACTIVE; staging, retries,
  // recovery, reconnects, and key rotation do not create another review or reset
  // its state. The initial session of a newly created account and sessions
  // predating this feature start confirmed (false). Persist review state with
  // session activation. Clients prompt only for unconfirmed non-current sessions.
  bool unconfirmed = 13;
}

// GetSessionsRequest is empty; the account comes from trusted session context.
message GetSessionsRequest {}

// GetSessionsResponse returns a complete active-session snapshot for the user.
message GetSessionsResponse {
  // All active sessions for the user.
  repeated Session sessions = 1;
}

// ConfirmSessionRequest identifies the login recognized by the user.
message ConfirmSessionRequest {
  // Required canonical, nonzero device-session UUID of another active session
  // of the current account. Never a credential or authorization-key handle.
  string session_id = 1;
}

// ConfirmSessionResponse reports the target at the confirmation commit point.
// A later revocation or expiry may already have removed it; do not use this
// response to overwrite a newer GetSessions snapshot.
message ConfirmSessionResponse {
  // Required target projection with unconfirmed=false and current=false.
  Session session = 1;
}

// SessionChanged is a refresh hint carried by the runtime's general notification
// mechanism, not an RPC response, subscription, or transport envelope. Publish
// after committed activation of a new device session, confirmation, revocation,
// or expiry, only to authorized sessions of the same account. Recheck recipient
// authorization at delivery. Key rotation and enrollment retries do not create
// another login review; activity-only changes need not notify.
// Notifications may duplicate, coalesce, arrive late, or be missed while offline.
// Call GetSessions for current review and lifecycle state; never create a prompt
// or restore a session from this hint alone. Fetch on startup, foreground, and
// reconnect even without a hint. If a hint arrives during a fetch, refresh again
// afterwards so that an in-flight snapshot cannot swallow a subsequent change.
// Routing, push delivery, and transport bindings belong to the implementation.
message SessionChanged {
  // Required neutral UUID of the changed session, not a credential or proof of
  // current activity. It may no longer appear in GetSessions after revocation
  // or expiry. A hint about one's own session does not replace authorization.
  string session_id = 1;
}

// ProfilePhotoSource defines a photo from completed uploader-owned files.
// Required metadata declares STRICT_LOSSLESS version 1, PNG or static lossless
// WebP, and matching positive dimensions at most 4096x4096. Main bytes are at
// most 10,000,000 bytes; animation is rejected. Supply at most one optional static
// THUMBNAIL input (at most 160x160, 256 KiB), with both dimensions required.
// Validate its bytes under the same profile. PREVIEW, FULL, extra variants and
// unknown roles are rejected, never silently discarded. file_id names the main
// image. Servers generate a required lower-pixel thumbnail before gallery-entry
// publication under MediaValidation rules; clients process/upload the main.
message ProfilePhotoSource {
  // Positive canonical completed-file ID; never an upload ID, URL or inline bytes.
  int64 file_id = 1;
  // Required dimensions, format, static-animation flag and validation declaration.
  ImageMetadata metadata = 2;
  // Optional completed caller-owned thumbnail input, not a required upload.
  repeated MediaVariantSource variants = 3;
}

// ProfilePhoto is a retained gallery entry with canonical immutable-file references.
// Metadata and variants are validated at creation and cannot be edited in place.
message ProfilePhoto {
  // Positive stable gallery-entry ID; not a file ID and never reassigned.
  int64 photo_id = 1;
  // Owning account ID, derived from trusted session context at creation.
  int64 user_id = 2;
  // Canonical file ID of the validated main photo.
  int64 file_id = 3;
  // Validated format, dimensions and validation profile/version.
  ImageMetadata metadata = 4;
  // Validated stored variants; access-checked with the gallery entry.
  repeated MediaVariant variants = 5;
  // Server time of gallery insertion; selection does not change ordering.
  google.protobuf.Timestamp created_at = 6;
}

// SetProfilePhotoRequest inserts or selects a photo for the current account.
// Gallery revisions start at 1 even when empty, increase once per actual gallery
// or selection change, and never wrap or reuse values. All gallery mutations
// require positive expected_revision; compare atomically before no-op detection.
// A mismatch is ABORTED without effect; refetch and reconcile, never blindly
// retry against a fresh revision. A timeout/cancellation does not prove rollback.
// While an entry is retained, repeating its exact main file/source reuses its
// photo_id rather than consuming another slot. A changed source for the same
// main file is rejected, not silently substituted. At a matching revision,
// selecting that already-selected entry is a no-op; selecting it from elsewhere
// changes selection/revision, not identity or gallery order. After an ambiguous
// call, find its file/source in GetProfilePhotos and reconcile selection before
// acting again. No operation-ID replay or deduplication across deletion is promised.
message SetProfilePhotoRequest {
  // Required complete source; validate all files before changing gallery/selection.
  ProfilePhotoSource source = 1;
  // Required positive owner gallery_revision; zero/absence is invalid.
  uint64 expected_revision = 2;
}

// SetProfilePhotoResponse returns the newly selected gallery entry.
message SetProfilePhotoResponse {
  // Complete validated selected photo.
  ProfilePhoto photo = 1;
  // Owner gallery revision atomically resulting from this insertion/selection.
  uint64 gallery_revision = 2;
}

// GetProfilePhotosRequest chooses self or another user's privacy-filtered view.
message GetProfilePhotosRequest {
  // Omit for self; when present must be positive. Does not assert caller identity.
  optional int64 user_id = 1;
}

// GetProfilePhotosResponse is one consistent gallery/selection snapshot.
message GetProfilePhotosResponse {
  // At most 10 entries, newest insertion first (descending photo_id for ties).
  // Nonowners receive at most the selected entry. Unknown/inaccessible accounts
  // return the same empty projection, without disclosing gallery membership.
  repeated ProfilePhoto photos = 1;
  // Present for self (zero means no selection), or when a selected photo is
  // disclosed to a nonowner; absent otherwise. A positive value names an entry
  // in photos. Never infer selection from list position.
  optional int64 selected_photo_id = 2;
  // Required positive revision for self, from the same snapshot as selection
  // and photos. Omitted for nonowners, including privacy-visible selected photos,
  // so hidden owner-gallery changes do not leak through a revision counter.
  optional uint64 gallery_revision = 3;
}

// SelectProfilePhotoRequest selects an existing photo owned by the current account.
message SelectProfilePhotoRequest {
  // Positive gallery-entry ID; unknown/foreign IDs report NOT_FOUND alike.
  int64 photo_id = 1;
  // Required positive current owner gallery_revision, checked before any no-op.
  uint64 expected_revision = 2;
}

// SelectProfilePhotoResponse returns the selected entry without reordering it.
message SelectProfilePhotoResponse {
  // Complete current selected photo.
  ProfilePhoto photo = 1;
  // Owner gallery revision from the same atomic selection result.
  uint64 gallery_revision = 2;
}

// DeleteProfilePhotoRequest removes a gallery entry owned by the current account.
message DeleteProfilePhotoRequest {
  // Positive gallery-entry ID; unknown/foreign IDs report NOT_FOUND alike.
  int64 photo_id = 1;
  // Required positive current owner gallery_revision; stale removal is ABORTED.
  uint64 expected_revision = 2;
}

// DeleteProfilePhotoResponse reports gallery removal and its resulting selection.
// Selection/removal and file-reference grants change atomically. A deletion does
// not erase files referenced elsewhere, or revoke the uploader's own file access.
message DeleteProfilePhotoResponse {
  // True after the entry was removed.
  bool deleted = 1;
  // Current selection, zero when none. No implicit fallback selection occurs.
  int64 selected_photo_id = 2;
  // Owner gallery revision atomically resulting from removal/selection clearing.
  uint64 gallery_revision = 3;
}
