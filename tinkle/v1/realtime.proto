// Public realtime application data, independent of gRPC transport.
// The published RealtimeFrame family is frozen for the legacy JSON WebSocket.
// The batched Syntra binding uses RealtimeNotification inside opaque core
// Notification.payload; it does not add another handshake or transport frame.
// See REALTIME.md for application requirements and generic RPC method bindings.
syntax = "proto3";

package tinkle.v1;

import "google/protobuf/timestamp.proto";
import "tinkle/v1/messages.proto";

option go_package = "github.com/tinklehq/tinkle-proto/tinkle/v1;tinklev1";

// RealtimeFrame is a version-1 server data frame on /connection/websocket.
// Exactly one body must match type. The wire uses strict snake_case JSON with
// unwrapped oneof members, not a protobuf binary frame or a new gRPC service.
message RealtimeFrame {
  // type is ready, update, presence, reset_required, or error, matching body.
  string type = 1;
  // body contains exactly the payload selected by type; unknown combinations fail.
  oneof body {
    // ready confirms this socket's presence lease, not room authorization or replay completion.
    RealtimeReady ready = 2;
    // update is one public durable delivery or a redacted cursor advance.
    RealtimeUpdate update = 3;
    // presence is privacy-filtered ephemeral online/known state for a requested user.
    RealtimeOnline presence = 4;
    // reset_required stops this subscription until an authoritative public snapshot is fetched.
    RealtimeResetRequired reset_required = 5 [json_name = "reset_required"];
    // error contains a generic terminal code; delivery before socket close is best-effort.
    RealtimeError error = 6;
  }
}

// RealtimeReady is the first server data frame after authentication and lease registration.
message RealtimeReady {
  // version is 1, encoded as a JSON number.
  uint32 version = 1;
  // connection_id is the random UUID for this socket, never a device or auth-session ID.
  string connection_id = 2 [json_name = "connection_id"];
  // stream is user:<verified-user-id>; clients cannot choose another private user stream.
  string stream = 3;
  // after_cursor is the requested own-stream resume cursor, always a decimal JSON string.
  optional uint64 after_cursor = 4 [json_name = "after_cursor"];
  // ping_interval_ms is the server control-ping interval (5000), a JSON number.
  uint32 ping_interval_ms = 5 [json_name = "ping_interval_ms"];
  // pong_timeout_ms is liveness since the last actual accepted pong (15000), a JSON number.
  uint32 pong_timeout_ms = 6 [json_name = "pong_timeout_ms"];
}

// RealtimeUpdate is a public delivery, not an internal journal or policy protobuf.
// For update.redacted, only cursor, stream and event_type appear in manual JSON.
message RealtimeUpdate {
  // event_id is the stable source UUID, absent for a redacted cursor advance.
  string event_id = 1 [json_name = "event_id"];
  // cursor is the stream-local replay cursor, a positive decimal JSON string, not a source sequence.
  optional uint64 cursor = 2;
  // stream is user:<verified-user-id> or an explicitly authorized room:<room-id>.
  string stream = 3;
  // event_type is message.snapshot, message.send_failed, update.redacted, or dialog.read_advanced.
  string event_type = 4 [json_name = "event_type"];
  // payload is standard padded base64 in JSON. For message.snapshot and
  // message.send_failed it is serialized tinkle.v1.Message from messages.proto,
  // mapped to the viewer's DM counterparty or room chat_id. It NEVER contains
  // internal message/journal/admission/policy protobufs. It is absent for
  // update.redacted and dialog.read_advanced; the latter is a metadata-only
  // invalidation hint requiring a public dialog-state refetch. No other payload
  // type or arbitrary opaque extension is defined by version 1.
  bytes payload = 5;
  // occurred_at is the source event occurrence time, an optional RFC 3339 UTC JSON string.
  google.protobuf.Timestamp occurred_at = 6 [json_name = "occurred_at"];
  // source_seq is the source ordering marker as a decimal JSON string, including zero when present.
  optional int64 source_seq = 7 [json_name = "source_seq"];
  // source_revision is the source revision as a decimal JSON string, independent of cursor.
  optional int64 source_revision = 8 [json_name = "source_revision"];
  // message_id is the immutable public message ID as a positive decimal JSON string.
  optional int64 message_id = 9 [json_name = "message_id"];
  // message_created_at is original creation time, never an edit/occurrence timestamp.
  google.protobuf.Timestamp message_created_at = 10 [json_name = "message_created_at"];
  // random_id is the nonzero signed SendMessageRequest idempotency key as a decimal
  // JSON string, present only for the authenticated sender. It correlates durable
  // success/failure after a lost send-RPC response and is absent for other viewers.
  optional int64 random_id = 11 [json_name = "random_id"];
}

// RealtimeOnline discloses only aggregate connectivity, never devices or last-seen data.
message RealtimeOnline {
  // user_id is a requested positive user ID, encoded as a decimal JSON string.
  int64 user_id = 1 [json_name = "user_id"];
  // online is true only when known and an authorized live connection exists; always present in JSON.
  bool online = 2;
  // known is false for hidden or unknown users; false never proves offline and retracts prior state.
  bool known = 3;
  // revision is a decimal JSON string scoped to the presence backend generation;
  // it is always "0" when unknown and is never a durable update replay cursor.
  optional uint64 revision = 4;
}

// RealtimeResetRequired invalidates one subscription while leaving the socket alive.
message RealtimeResetRequired {
  // stream is the subscription requiring an authoritative public snapshot before resuming.
  string stream = 1;
  // head is an optional authoritative server head as a decimal JSON string.
  // It is omitted when unavailable, never guessed from the client's requested cursor.
  optional uint64 head = 2;
}

// RealtimeError carries no private backend diagnostics or admission-policy reason.
message RealtimeError {
  // code is unauthenticated, forbidden, invalid_frame, reconnect_required,
  // unavailable, lease_expired, slow_client, capacity, or internal. Clients must
  // also handle close without an error frame and reconnect with backoff as appropriate.
  string code = 1;
}

// RealtimeConnectControl is the one optional initial client text data frame.
// It may be sent immediately after upgrade or after ready, within the configured
// connect window. It cannot publish business data or select another user stream.
message RealtimeConnectControl {
  // type must be the exact string connect; no other client data-frame types are allowed.
  string type = 1;
  // rooms maps positive canonical decimal room-ID strings to canonical decimal
  // last-applied cursor strings. At most STREAMS_MAX-1 (maximum 15) rooms are
  // permitted, reserving the own-user stream; current backend room policy grants
  // access. Omitted rooms means no room subscriptions. Duplicate JSON keys,
  // unknown fields, arrays, trailing JSON and second/late controls are rejected.
  map<string, string> rooms = 2;
}

// Batched Syntra application binding; see REALTIME.md for normative behavior.
// /tinkle.v1.Realtime/SubscribeBatched and UnsubscribeBatched are generic Syntra
// dispatcher methods, not a new gRPC service. They use the typed requests/results
// below. Failures use the core RpcResult.error; there is no Tinkle transport error.
// Every notification is one RealtimeNotification. Durable updates are complete
// RealtimeBatch values; bare events, flattened batches and decoder guessing are
// forbidden. No application ready, handshake, version or connection ID is added.
// Existing experimental Subscribe methods retain their separate old formats.
// Cursor scope is per authenticated principal/stream/history scope, independent
// of connections. An absent subscription cursor means zero, not start-live.
// Supported positions fit signed 64-bit storage; deliveries are positive.
// Cursors below replay_floor expire; equality with that largest removed cursor
// is valid. Reset head is diagnostic, never a consistent snapshot checkpoint.
// Snapshot fencing, room reconnect scope and privacy-safe cache eviction remain
// independent implementation gates; no snapshot RPC or exactly-once guarantee
// is introduced. Generated protobuf types do not enforce application validation.

// RealtimeRoomSubscription expresses interest in one shared room stream.
// The room authority grants access per poll; revocation surfaces as redaction
// or reset, never as a policy diagnostic.
message RealtimeRoomSubscription {
  // room_id is the positive shared room identifier. Zero is rejected.
  int64 room_id = 1;
  // after_cursor is the last-fully-applied room cursor, 0..9223372036854775807.
  // Absent means zero; below-floor cursors reset, never silently start live.
  // A new room history scope requires independently established continuity.
  optional uint64 after_cursor = 2 [json_name = "after_cursor"];
}

// SubscribeRequest is the payload of the Syntra SubscribeBatched method.
// It carries only authorized room and presence interests; the own-user stream
// is never client-selectable.
message SubscribeRequest {
  // own_cursor is the last-fully-applied own-stream cursor, 0..9223372036854775807.
  // Absent means zero, not start-live. A retained checkpoint survives connections;
  // it is never a storage sequence, Syntra connection_id or request_id.
  optional uint64 own_cursor = 1 [json_name = "own_cursor"];
  // rooms lists at most 15 distinct positive room interests, subject to a lower
  // deployment cap with one slot reserved for the own-user stream.
  repeated RealtimeRoomSubscription rooms = 2;
  // watch_user_ids lists at most 100 distinct positive presence interests.
  // The presence authority enforces contact and privacy policy; hidden users
  // yield known=false retractions.
  repeated int64 watch_user_ids = 3 [json_name = "watch_user_ids"];
}

// SubscribeResponse confirms registration, not replay completion or a snapshot.
// It contains application state only; Syntra owns connection identity and liveness.
message SubscribeResponse {
  // The unpublished draft duplicated Syntra's connection diagnostic here.
  reserved 1;
  reserved "connection_id";
  // stream is user:<verified-user-id>, derived from authenticated identity.
  string stream = 2;
  // after_cursor echoes the requested own-stream application position.
  // It is not proof of a successful replay or snapshot/checkpoint consistency.
  uint64 after_cursor = 3 [json_name = "after_cursor"];
  // head is optional observed stream progress, omitted when unknown and never
  // guessed. It is diagnostic only, not a source snapshot fence or resume grant.
  optional uint64 head = 4;
}

// UnsubscribeRequest is the payload of the Syntra UnsubscribeBatched method.
// The durable own-user stream cannot be released except by closing the transport.
message UnsubscribeRequest {
  // room_ids lists shared room IDs to release. Empty means none unless
  // release_all is true.
  repeated int64 room_ids = 1 [json_name = "room_ids"];
  // unwatch_user_ids lists presence IDs to release. Empty means none unless
  // release_all is true.
  repeated int64 unwatch_user_ids = 2 [json_name = "unwatch_user_ids"];
  // release_all releases all optional room and presence watches when true.
  bool release_all = 3 [json_name = "release_all"];
}

// UnsubscribeResponse confirms watch release on this connection.
message UnsubscribeResponse {
  // released is true when the requested watches were released, including the
  // no-op case where nothing was held.
  bool released = 1;
}

// RealtimeEventType mirrors the RealtimeEvent oneof discriminator for filtering
// and logging. Canonical routing uses the oneof kind; type must match kind.
// The zero value is never sent on the wire.
enum RealtimeEventType {
  // REALTIME_EVENT_TYPE_UNSPECIFIED is the default and is never sent.
  REALTIME_EVENT_TYPE_UNSPECIFIED = 0;
  // REALTIME_EVENT_TYPE_MESSAGE_SNAPSHOT is a new or currently visible message.
  REALTIME_EVENT_TYPE_MESSAGE_SNAPSHOT = 1;
  // REALTIME_EVENT_TYPE_MESSAGE_SEND_FAILED is a sender-only failed attempt.
  REALTIME_EVENT_TYPE_MESSAGE_SEND_FAILED = 2;
  // REALTIME_EVENT_TYPE_UPDATE_REDACTED is a cursor advance without payload.
  REALTIME_EVENT_TYPE_UPDATE_REDACTED = 3;
  // REALTIME_EVENT_TYPE_DIALOG_READ_ADVANCED is a read-state invalidation hint.
  REALTIME_EVENT_TYPE_DIALOG_READ_ADVANCED = 4;
  // REALTIME_EVENT_TYPE_USER_HYDRATION is an ID-only sender primer.
  REALTIME_EVENT_TYPE_USER_HYDRATION = 5;
  // REALTIME_EVENT_TYPE_CHAT_HYDRATION is an ID-only conversation primer.
  REALTIME_EVENT_TYPE_CHAT_HYDRATION = 6;
  // REALTIME_EVENT_TYPE_CHAT_POSITION is a conversation sort-key hint.
  REALTIME_EVENT_TYPE_CHAT_POSITION = 7;
}

// RealtimeMessageSnapshot is a newly created or currently visible message.
// It reuses the public tinkle.v1.Message from messages.proto, mapped to the
// viewer's DM counterparty or room chat_id. It never contains internal
// message, journal, admission, or policy protobufs and never carries unknown
// fields. Edits are observed as the same variant with Message.edit_date set.
message RealtimeMessageSnapshot {
  // message is the public hydrated message projection.
  Message message = 1;
  // random_id is the nonzero signed SendMessageRequest idempotency key, present
  // only for the authenticated sender. It correlates durable success after a
  // lost send-RPC response and is absent for other viewers. It is never a
  // replay cursor.
  optional int64 random_id = 2 [json_name = "random_id"];
}

// RealtimeMessageSendFailed is a failed durable send outcome for the sender.
// It is delivered only on the authenticated sender's user stream with no
// admission or policy reason.
message RealtimeMessageSendFailed {
  // message is the public projection of the failed attempt.
  Message message = 1;
  // random_id is the nonzero signed SendMessageRequest idempotency key used to
  // correlate the failure after a lost send-RPC response.
  int64 random_id = 2 [json_name = "random_id"];
}

// RealtimeUpdateRedacted is a cursor advance without payload or identifying
// metadata. Deletions, revocations, and hidden content are observed this way.
// It is not an identifying deletion receipt and cannot evict a cached message;
// privacy-safe cache reconciliation remains a separate application requirement.
message RealtimeUpdateRedacted {}

// RealtimeDialogReadAdvanced is a metadata-only read-state invalidation hint on
// the own-user stream. Clients refetch dialog and read state through the public
// GetDialogs, GetHistory, and related RPCs. No opaque private bytes are exposed.
message RealtimeDialogReadAdvanced {}

// RealtimeUserHydration is an ID-only sender primer sharing the triggering
// snapshot's (event_id, cursor). Clients fetch the full entity through
// UsersService.GetUsers. Primers are deduplicated per connection and carry no
// durable state.
message RealtimeUserHydration {
  // user_id is the positive sender seen for the first time on this connection.
  int64 user_id = 1 [json_name = "user_id"];
}

// RealtimeChatHydration is an ID-only conversation primer sharing the triggering
// snapshot's (event_id, cursor). Clients fetch full state through the public
// channel and message RPCs. Primers are deduplicated per connection.
message RealtimeChatHydration {
  // chat_key is room:<positive-id> for shared rooms or the sorted DM pair key
  // "a:b" for direct messages.
  string chat_key = 1 [json_name = "chat_key"];
}

// RealtimeChatPosition is a conversation sort-key hint sharing the triggering
// snapshot's (event_id, cursor). Clients apply it after the snapshot and never
// persist position independently of the snapshot.
message RealtimeChatPosition {
  // chat_key is the same conversation key as the hydration primer.
  string chat_key = 1 [json_name = "chat_key"];
  // order is the lexicographically sortable position key OrderFor(cursor,
  // source_seq) for this cursor and source marker.
  string order = 2;
}

// RealtimeEvent is one member of a complete application RealtimeBatch.
// It is never sent directly as Notification.payload. All members for a source
// update share stream/cursor/UUID, except an identity-free singleton redaction.
// Validate the selected kind and matching enum before applying the whole batch.
message RealtimeEvent {
  // event_id is the stable lowercase canonical source UUID. It is empty only
  // for a redacted cursor advance that carries no source identity.
  string event_id = 1 [json_name = "event_id"];
  // stream is user:<positive-id> or room:<positive-id> in canonical form.
  string stream = 2;
  // cursor is the positive stream-local replay cursor, gapless per stream. It is
  // never a storage sequence number and never a Syntra request_id.
  uint64 cursor = 3;
  // occurred_at is the source occurrence time. It is absent for redacted advances.
  google.protobuf.Timestamp occurred_at = 4 [json_name = "occurred_at"];
  // source_seq is the source ordering marker, preserved independently of cursor.
  optional int64 source_seq = 5 [json_name = "source_seq"];
  // source_revision is the source revision marker, preserved independently of cursor.
  optional int64 source_revision = 6 [json_name = "source_revision"];
  // type mirrors the oneof discriminator for filtering and logging and must
  // match the selected kind.
  RealtimeEventType type = 7;
  // kind carries exactly the typed payload selected by type.
  oneof kind {
    // message_snapshot is a new or currently visible hydrated message.
    RealtimeMessageSnapshot message_snapshot = 8 [json_name = "message_snapshot"];
    // message_send_failed is a sender-only failed attempt with correlation ID.
    RealtimeMessageSendFailed message_send_failed = 9 [json_name = "message_send_failed"];
    // update_redacted is a payload-free cursor advance for deleted, revoked, or
    // hidden content.
    RealtimeUpdateRedacted update_redacted = 10 [json_name = "update_redacted"];
    // dialog_read_advanced is a read-state invalidation hint requiring a refetch.
    RealtimeDialogReadAdvanced dialog_read_advanced = 11 [json_name = "dialog_read_advanced"];
    // user_hydration is an ID-only sender primer for this connection.
    RealtimeUserHydration user_hydration = 12 [json_name = "user_hydration"];
    // chat_hydration is an ID-only conversation primer for this connection.
    RealtimeChatHydration chat_hydration = 13 [json_name = "chat_hydration"];
    // chat_position is the conversation sort-key hint applied after the snapshot.
    RealtimeChatPosition chat_position = 14 [json_name = "chat_position"];
  }
}

// RealtimeBatch contains all 1..4 events derived from one source update in one
// stream. It is carried only as RealtimeNotification.batch, never split across
// notifications. REALTIME.md defines the allowed member grammar and validation.
// Clients atomically apply every required effect and checkpoint, or neither.
message RealtimeBatch {
  // stream is the canonical stream every member belongs to.
  string stream = 1;
  // events is exactly one of: optional user/chat primers then snapshot/failure
  // and required position, a singleton redaction, or a singleton read invalidation.
  // Every member has the batch stream/final_cursor and common source UUID, except
  // the redaction singleton has no UUID or identifying metadata. Maximum 4 members.
  repeated RealtimeEvent events = 2;
  // final_cursor is positive, at most 9223372036854775807, and equals every
  // member's cursor. Persist only after all required data/effects are applied.
  // Receipt/enqueue is not application commit; a partial batch never advances it.
  uint64 final_cursor = 3 [json_name = "final_cursor"];
}

// RealtimeNotification is the sole Tinkle realtime Notification.payload type
// after successful SubscribeBatched selection. It discriminates application data,
// not transport operations: no version, connection ID, hello/ready or RPC error.
// Empty or unsupported kind is invalid; generated oneof decoding alone is not
// application validation. Never infer a payload type by trying several decoders.
message RealtimeNotification {
  // kind selects exactly one known application delivery. Unknown semantic
  // variants must stop application without advancing any durable checkpoint.
  oneof kind {
    // batch is one complete bounded durable update and its atomic checkpoint.
    RealtimeBatch batch = 1;
    // presence is ephemeral privacy-filtered state, never a replay checkpoint.
    RealtimeOnline presence = 2;
    // reset_required stops one stream sequence. Its head is diagnostic only;
    // consistent snapshot recovery requires a separately reviewed source fence.
    RealtimeResetRequired reset_required = 3 [json_name = "reset_required"];
  }
}
