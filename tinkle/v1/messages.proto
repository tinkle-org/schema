// Messages gRPC Service - Client-Facing Messaging Operations.
//
// Provides all client-visible chat, dialog, history, message, reaction,
// poll, and thread operations. Aggregates dialog/chat/messaging state
// across the message, dialog, chat, and roster core services.
//
// All methods require an active device-key-authenticated session; user_id comes
// from trusted session context.
syntax = "proto3";

package tinkle.v1;

import "google/protobuf/timestamp.proto";
import "tinkle/v1/account.proto";
import "tinkle/v1/common.proto";
import "tinkle/v1/entities.proto";
import "tinkle/v1/media.proto";

option go_package = "github.com/tinklehq/tinkle-proto/tinkle/v1;tinklev1";

// MessagesService provides client-facing messaging operations.
service MessagesService {
  // ---- Dialog & History (7 RPCs) ----

  // GetDialogs returns the authenticated user's dialog list.
  rpc GetDialogs(GetDialogsRequest) returns (GetDialogsResponse);
  // GetHistory returns message history for a conversation with cursor-based pagination.
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  // GetMessages fetches specific messages by ID in one conversation.
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  // ListMessageChanges lists authorized retained body, metadata and removal changes
  // of one conversation after a caller-supplied mutation acceptance position.
  rpc ListMessageChanges(ListMessageChangesRequest) returns (ListMessageChangesResponse);
  // MarkHistoryRead marks messages as read up to a specified message_id.
  rpc MarkHistoryRead(MarkHistoryReadRequest) returns (MarkHistoryReadResponse);
  // DeleteHistory deletes history for the caller, optionally revoking the sender's own messages.
  rpc DeleteHistory(DeleteHistoryRequest) returns (DeleteHistoryResponse);
  // DeleteMessages deletes specific messages by ID.
  rpc DeleteMessages(DeleteMessagesRequest) returns (DeleteMessagesResponse);

  // ---- Chat Creation & Structure (6 RPCs) ----

  // CreateChat creates a new group chat with initial participants.
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  // EditChatTitle updates a chat's title.
  rpc EditChatTitle(EditChatTitleRequest) returns (EditChatTitleResponse);
  // EditChatPhoto updates or removes a chat's photo.
  rpc EditChatPhoto(EditChatPhotoRequest) returns (EditChatPhotoResponse);
  // UpdateChatDescription updates a chat's description.
  rpc UpdateChatDescription(UpdateChatDescriptionRequest) returns (UpdateChatDescriptionResponse);
  // GetChats returns basic info for multiple chats by ID.
  rpc GetChats(GetChatsRequest) returns (GetChatsResponse);
  // GetChatDetails returns full chat details including participants, admins, and invite links.
  rpc GetChatDetails(GetChatDetailsRequest) returns (GetChatDetailsResponse);

  // ---- Participants & Scopes (4 RPCs) ----

  // AddChatParticipant adds a user to a group chat.
  rpc AddChatParticipant(AddChatParticipantRequest) returns (AddChatParticipantResponse);
  // RemoveChatParticipant removes a user from a group chat.
  rpc RemoveChatParticipant(RemoveChatParticipantRequest) returns (RemoveChatParticipantResponse);
  // EditChatAdmin promotes or demotes a chat admin.
  rpc EditChatAdmin(EditChatAdminRequest) returns (EditChatAdminResponse);
  // EditChatRestrictedScopes applies restricted permissions to a user in a chat.
  rpc EditChatRestrictedScopes(EditChatRestrictedScopesRequest) returns (EditChatRestrictedScopesResponse);

  // ---- TTL, Pinned, Scheduled (5 RPCs) ----

  // SetHistoryTTL configures auto-delete timer for a conversation.
  rpc SetHistoryTTL(SetHistoryTTLRequest) returns (SetHistoryTTLResponse);
  // SetMessagePin pins or unpins a message in the selected shared or personal scope.
  rpc SetMessagePin(SetMessagePinRequest) returns (SetMessagePinResponse);
  // UnpinAllMessages unpins all messages in a conversation or thread.
  rpc UnpinAllMessages(UnpinAllMessagesRequest) returns (UnpinAllMessagesResponse);
  // GetScheduledMessages explicitly resolves owned jobs, not a discoverable job list.
  rpc GetScheduledMessages(GetScheduledMessagesRequest) returns (GetScheduledMessagesResponse);
  // CancelScheduledMessages cancels pending owned jobs; any album item selects its whole group.
  rpc CancelScheduledMessages(CancelScheduledMessagesRequest) returns (CancelScheduledMessagesResponse);

  // ---- Sending & Editing (6 RPCs) ----

  // SendMessage sends a text message to a conversation.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // SendMedia sends a media message (photo, document, geo, contact, poll).
  rpc SendMedia(SendMediaRequest) returns (SendMediaResponse);
  // SendAlbum sends an album of multiple media items.
  rpc SendAlbum(SendAlbumRequest) returns (SendAlbumResponse);
  // EditMessage edits an existing message's content or media.
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  // SetTyping broadcasts a typing indicator to conversation participants.
  rpc SetTyping(SetTypingRequest) returns (SetTypingResponse);
  // StartBot starts a bot interaction with a start parameter.
  rpc StartBot(StartBotRequest) returns (StartBotResponse);

  // ---- Search (1 RPC) ----

  // Search searches messages within a conversation or globally.
  rpc Search(SearchRequest) returns (SearchResponse);

  // ---- Reactions (8 RPCs) ----

  // BatchGetMessageReactions returns reaction summaries for multiple messages.
  rpc BatchGetMessageReactions(BatchGetMessageReactionsRequest) returns (BatchGetMessageReactionsResponse);
  // ListMessageReactions returns individual reactors for a message.
  rpc ListMessageReactions(ListMessageReactionsRequest) returns (ListMessageReactionsResponse);
  // SendReaction adds or removes reactions on a message.
  rpc SendReaction(SendReactionRequest) returns (SendReactionResponse);
  // GetRecentReactions reads the caller's bounded exact-version reaction collection.
  rpc GetRecentReactions(GetRecentReactionsRequest) returns (GetRecentReactionsResponse);
  // GetUnreadMentions returns messages mentioning the authenticated user.
  rpc GetUnreadMentions(GetUnreadMentionsRequest) returns (GetUnreadMentionsResponse);
  // ReadMentions marks all mentions in a conversation as read.
  rpc ReadMentions(ReadMentionsRequest) returns (ReadMentionsResponse);
  // GetUnreadReactions returns messages with new reactions for the authenticated user.
  rpc GetUnreadReactions(GetUnreadReactionsRequest) returns (GetUnreadReactionsResponse);
  // ReadReactions marks all reactions in a conversation as read.
  rpc ReadReactions(ReadReactionsRequest) returns (ReadReactionsResponse);

  // ---- Polls & Votes (4 RPCs) ----

  // SendVote records or retracts a vote on a poll.
  rpc SendVote(SendVoteRequest) returns (SendVoteResponse);
  // GetPollVotes returns per-option voter lists with pagination.
  rpc GetPollVotes(GetPollVotesRequest) returns (GetPollVotesResponse);
  // GetPollResults returns current poll results.
  rpc GetPollResults(GetPollResultsRequest) returns (GetPollResultsResponse);
  // ClosePoll permanently closes the caller's own poll, returning its authorized projection.
  rpc ClosePoll(ClosePollRequest) returns (ClosePollResponse);

  // ---- Threaded (2 RPCs) ----

  // ReadThread marks thread messages as read up to a specified ID.
  rpc ReadThread(ReadThreadRequest) returns (ReadThreadResponse);
  // ListThreadMessages returns thread replies with pagination.
  rpc ListThreadMessages(ListThreadMessagesRequest) returns (ListThreadMessagesResponse);
}

// =============================================================================
// Enums
// =============================================================================

// ChatType describes the type of a chat.
enum ChatType {
  CHAT_TYPE_UNSPECIFIED = 0;
  CHAT_TYPE_GROUP = 1;
  CHAT_TYPE_CHANNEL = 2;
  CHAT_TYPE_BROADCAST = 3;
}

// ScheduleState describes durable job ownership, independently of message visibility.
enum ScheduleState {
  // No authoritative job state supplied.
  SCHEDULE_STATE_UNSPECIFIED = 0;
  // Enqueued and still cancellable; not an accepted history entry.
  SCHEDULE_STATE_PENDING = 1;
  // Dispatch owns the job; cancellation cannot promise rollback.
  SCHEDULE_STATE_PROCESSING = 2;
  // Dispatch completed; this does not prove peer receipt or current body visibility.
  SCHEDULE_STATE_DELIVERED = 3;
  // Durable cancellation fenced dispatch before acceptance.
  SCHEDULE_STATE_CANCELED = 4;
  // Dispatch was durably fenced without delivery, not merely timed out.
  SCHEDULE_STATE_FAILED = 5;
}

// ScheduledMessage is an owned job descriptor, never by itself accepted history.
// Job status is not acceptance proof for a history entry or a peer receipt.
message ScheduledMessage {
  // Frozen message identity, also retained through terminal states.
  int64 message_id = 1;
  // Original nonzero signed client retry key of this item.
  int64 idempotency_key = 2;
  // Authorized conversation containing this job.
  Target target = 3;
  // Current due time, including pending rescheduling.
  google.protobuf.Timestamp scheduled_at = 4;
  // Authoritative durable lifecycle state.
  ScheduleState state = 5;
  // Stable shared album identity when this job is an album item.
  optional int64 album_id = 6;
  // Optional currently authorized owned snapshot. Pending snapshots have no
  // acceptance position. Delivered snapshots use current history visibility,
  // never the frozen prepared body; processing/canceled/failed have no snapshot.
  Message message = 7;
}

// GetScheduledMessagesRequest explicitly selects jobs in one conversation.
// Only jobs owned by the authenticated actor are eligible. No implicit discovery:
// an empty selector request is invalid, never a request to enumerate owned jobs.
message GetScheduledMessagesRequest {
  // Required conversation under current read authorization.
  Target target = 1;
  // Exactly one selector collection must be nonempty, with 1..100 distinct
  // positive identities. Unknown, unowned and expired jobs are omitted.
  repeated int64 message_ids = 2;
  // Alternative 1..100 distinct nonzero signed retry keys, including album items.
  repeated int64 idempotency_keys = 3;
}

// GetScheduledMessagesResponse preserves selector order, minus omitted jobs.
message GetScheduledMessagesResponse {
  // At most one owned item per explicit selector; albums are not expanded.
  repeated ScheduledMessage messages = 1;
}

// CancelScheduledMessagesRequest selects owned jobs, never accepted history deletion.
// Only jobs owned by the authenticated actor are eligible; selectors grant no access.
message CancelScheduledMessagesRequest {
  // Required conversation under current read authorization.
  Target target = 1;
  // 1..100 distinct positive identities. Any album item selects the whole group;
  // repeated selections within the same group cause only one cancellation.
  repeated int64 message_ids = 2;
}

// CancelScheduledMessagesResponse reports durable canceled states, not rollback
// or a batch transaction. An error may follow partial effects; reconcile via lookup.
message CancelScheduledMessagesResponse {
  // Actual canceled items, including identical retries and expanded album items,
  // in first-selected group order and manifest order within each album. Unknown,
  // unowned, processing, delivered and failed jobs are omitted. At most 1000 items;
  // no snapshots. Accepted history is never revoked or removed by this operation.
  repeated ScheduledMessage messages = 1;
}

// ClosePollRequest identifies a currently visible sender-owned poll.
message ClosePollRequest {
  // Required conversation.
  Target target = 1;
  // Positive accepted poll identity.
  int64 message_id = 2;
}

// ClosePollResponse preserves the existing caller-relative poll disclosure rules.
// Correctness is hidden until the caller votes or the poll closes; use the same
// caller-relative projection as GetPollResults, not a separate answer-key response.
message ClosePollResponse {
  // Current authorized closed poll, including only disclosed correctness.
  Message message = 1;
}

// MessagesFilter filters search results by content type.
enum MessagesFilter {
  MESSAGES_FILTER_UNSPECIFIED = 0;
  MESSAGES_FILTER_PHOTOS = 1;
  MESSAGES_FILTER_VIDEO = 2;
  MESSAGES_FILTER_PHOTO_VIDEO = 3;
  MESSAGES_FILTER_DOCUMENT = 4;
  MESSAGES_FILTER_URL = 5;
  MESSAGES_FILTER_GIF = 6;
  MESSAGES_FILTER_VOICE = 7;
  MESSAGES_FILTER_MUSIC = 8;
  MESSAGES_FILTER_ROUND_VIDEO = 9;
  MESSAGES_FILTER_PINNED = 10;
  MESSAGES_FILTER_MENTIONS = 11;
}

// SearchSource identifies the backend selected for this search result.
enum SearchSource {
  // Source absent or unknown; do not infer a backend.
  SEARCH_SOURCE_UNSPECIFIED = 0;
  // Server search over the caller's authorized indexed messages.
  SEARCH_SOURCE_SERVER = 1;
  // Local search over messages retained for the authenticated principal.
  SEARCH_SOURCE_CACHE = 2;
}

// SearchCoverage identifies the corpus searched, independently of continuation.
enum SearchCoverage {
  // Coverage absent or unknown; do not infer completeness.
  SEARCH_COVERAGE_UNSPECIFIED = 0;
  // Authorized server index, subject to indexing visibility and freshness.
  SEARCH_COVERAGE_INDEXED = 1;
  // Locally cached subset, even when no further cached matches exist.
  SEARCH_COVERAGE_CACHED_SUBSET = 2;
}

// TypingAction describes the type of typing indicator.
enum TypingAction {
  TYPING_ACTION_UNSPECIFIED = 0;
  TYPING_ACTION_TYPING = 1;
  TYPING_ACTION_RECORD_AUDIO = 2;
  TYPING_ACTION_UPLOAD_PHOTO = 3;
  TYPING_ACTION_UPLOAD_DOCUMENT = 4;
  TYPING_ACTION_RECORD_VIDEO = 5;
  TYPING_ACTION_UPLOAD_VIDEO = 6;
  TYPING_ACTION_RECORD_ROUND = 7;
  TYPING_ACTION_UPLOAD_ROUND = 8;
  TYPING_ACTION_CHOOSE_STICKER = 9;
  TYPING_ACTION_CANCEL = 10;
}

// ChatRestrictedScope describes actions prohibited for participants when listed.
// SEND_MESSAGE prohibits all sends; SEND_MEDIA prohibits all file-backed media.
// The individual SEND_* categories remain independent: never collapse them to a
// broad restriction when reading or writing a participant's policy. Classify by
// the accepted source purpose, not a MIME declaration or file extension. Captions
// on media follow that media's category, not SEND_TEXT; raw documents, including
// images sent as documents, use SEND_DOCUMENT. Apply every relevant restriction
// to composite content, and reject unknown values rather than dropping them.
enum ChatRestrictedScope {
  CHAT_RESTRICTED_SCOPE_UNSPECIFIED = 0;
  CHAT_RESTRICTED_SCOPE_VIEW_MESSAGE = 1;
  CHAT_RESTRICTED_SCOPE_SEND_MESSAGE = 2;
  CHAT_RESTRICTED_SCOPE_SEND_MEDIA = 3;
  CHAT_RESTRICTED_SCOPE_SEND_STICKERS = 4;
  CHAT_RESTRICTED_SCOPE_SEND_GIFS = 5;
  CHAT_RESTRICTED_SCOPE_SEND_GAMES = 6;
  CHAT_RESTRICTED_SCOPE_SEND_INLINE = 7;
  CHAT_RESTRICTED_SCOPE_EMBED_LINKS = 8;
  CHAT_RESTRICTED_SCOPE_SEND_POLLS = 9;
  CHAT_RESTRICTED_SCOPE_CHANGE_INFO = 10;
  CHAT_RESTRICTED_SCOPE_INVITE_USERS = 11;
  CHAT_RESTRICTED_SCOPE_PIN_MESSAGES = 12;
  // Prohibit standalone text messages.
  CHAT_RESTRICTED_SCOPE_SEND_TEXT = 13;
  // Prohibit photo attachments, including explicitly typed image documents.
  CHAT_RESTRICTED_SCOPE_SEND_PHOTO = 14;
  // Prohibit video attachments, including round video notes.
  CHAT_RESTRICTED_SCOPE_SEND_VIDEO = 15;
  // Prohibit audio attachments other than voice messages.
  CHAT_RESTRICTED_SCOPE_SEND_AUDIO = 16;
  // Prohibit voice messages independently of other audio.
  CHAT_RESTRICTED_SCOPE_SEND_VOICE = 17;
  // Prohibit raw document attachments independently of typed media.
  CHAT_RESTRICTED_SCOPE_SEND_DOCUMENT = 18;
}

// PinScope selects whose pin state is changed, not who may read the message.
enum PinScope {
  // Invalid when explicitly supplied; omission on SetMessagePin selects SHARED.
  PIN_SCOPE_UNSPECIFIED = 0;
  // Conversation-wide pin state, subject to the caller's pin permissions.
  PIN_SCOPE_SHARED = 1;
  // Private pin state of the authenticated caller; never changes shared state.
  PIN_SCOPE_PERSONAL = 2;
}

// TargetChangeKind describes how a single message changed in one conversation.
// It enumerates the mutation markers retained in the enquiry journal at the
// change's original acceptance position.
enum TargetChangeKind {
  TARGET_CHANGE_KIND_UNSPECIFIED = 0;
  // The message body was edited; TargetChange.message carries the current body.
  TARGET_CHANGE_KIND_EDITED = 1;
  // The message was removed for this viewer; visibility for other participants is unchanged.
  TARGET_CHANGE_KIND_DELETED = 2;
  // The message was removed for every participant.
  TARGET_CHANGE_KIND_REVOKED = 3;
  // Pin state changed; hydrate the authorized current body, not a user edit.
  TARGET_CHANGE_KIND_PIN = 4;
  // Reactions changed; hydrate the authorized current body, not a user edit.
  TARGET_CHANGE_KIND_REACTION = 5;
  // Poll state/results changed; hydrate the authorized current body, not a user edit.
  TARGET_CHANGE_KIND_POLL = 6;
  // Private acknowledgement metadata changed for this viewer only. Disclose the
  // marker/body only to that viewer, never to other conversation participants.
  TARGET_CHANGE_KIND_ACK = 7;
}

// MessageScheduledState distinguishes queued delivery from visible messages.
enum MessageScheduledState {
  // Scheduling state was not reported; do not infer delivery.
  MESSAGE_SCHEDULED_STATE_UNSPECIFIED = 0;
  // Accepted without scheduling.
  MESSAGE_SCHEDULED_STATE_NOT_SCHEDULED = 1;
  // Queued for future delivery; visible only to the sender, not in history/search.
  MESSAGE_SCHEDULED_STATE_PENDING = 2;
  // A scheduled message has been delivered to the conversation.
  MESSAGE_SCHEDULED_STATE_SENT = 3;
}

// =============================================================================
// Core entity messages
// =============================================================================

// Dialog represents a conversation entry in the user's dialog list.
message Dialog {
  Target target = 1;
  int64 top_message = 2;
  int32 unread_count = 3;
  int64 read_inbox_max_id = 4;
  // DM-only outgoing message reference covered by the counterparty read watermark.
  // Absent when unknown or unsupported (including rooms); zero is a known empty
  // outgoing acknowledgement. This is a message ID, never an ordering position.
  optional int64 read_outbox_max_id = 5;
  bool pinned = 6;
  int64 space_id = 7;
  DraftMessage draft = 8;
  // Exact owned dialog generation for conditional draft clearing. Present only
  // in the authenticated owner's projection, including when draft content is absent.
  optional int64 draft_dialog_id = 9;
  // Source revision paired with draft_dialog_id, including zero before the first
  // draft. An initialized empty source reports both tokens with revision zero;
  // absent tokens mean unknown, not permission to clear. Persist and resend this
  // original pair; never infer it from dates or another principal's dialog.
  optional int64 draft_revision = 10;
  // Effective owner-resolved preferences for this dialog's exact account scope
  // and supported target override. Absent when no account setting exists.
  NotificationSetting notification_settings = 11;
  // Exact current caller-owned unread mentions; absent means unknown, not zero.
  optional int64 unread_mention_count = 12;
  // Exact current sender-owned unread reactions; absent means unknown, not zero.
  optional int64 unread_reaction_count = 13;
}

// DraftMessage represents an unsent draft in a dialog.
message DraftMessage {
  string message = 1;
  // Rich-text spans in message, using the shared UTF-16 entity rules.
  repeated Entity entities = 2;
  // Message being replied to in this draft's conversation.
  int64 reply_to_message_id = 3;
  google.protobuf.Timestamp date = 4;
}

// Message represents a single message in a conversation.
message Message {
  int64 message_id = 1;
  Target target = 2;
  int64 from_id = 3;
  google.protobuf.Timestamp date = 4;
  string message = 5;
  Media media = 6;
  // Rich-text spans in message, including media captions.
  repeated Entity entities = 7;
  MessageReplyHeader reply_to = 8;
  // Server time of the last user content edit. Pin, reaction, poll and private
  // acknowledgement changes do not manufacture or advance a user edit timestamp.
  google.protobuf.Timestamp edit_date = 9;
  MessageReactions reactions = 10;
  MessageReplies replies = 11;
  // Shared conversation pin state, independent of this caller's personal pin.
  bool pinned = 12;
  int32 ttl_period = 13;
  // accept_seq is the server-assigned acceptance position of this message within
  // its conversation. Positions are positive and start at one, monotonically
  // increasing per conversation, and are the ordering and deduplication token
  // for messages in that conversation; they are not globally comparable across
  // conversations and are not a replay cursor. The token is assigned once on
  // acceptance and stays stable across later body/metadata changes; mutations
  // have separate event positions disclosed under ListMessageChanges. This token
  // never ranks body freshness. Absent on pending scheduled messages; an absent token
  // never supplies an ordering or deduplication vote.
  optional int64 accept_seq = 14;
  // Positive, opaque album identifier shared by every item of one successful
  // SendAlbum call; scoped to target, stable across edits and delivery.
  // Absent for a standalone message. Album items are accepted atomically, in
  // request order; an invalid item rejects the entire album.
  optional int64 album_id = 15;
  // Delivery state. Pending messages have no accept_seq; delivery assigns it
  // once. A send acknowledgement for a pending message is not delivery proof.
  MessageScheduledState scheduled_state = 16;
  // Unix seconds of requested delivery, present for PENDING and SENT only.
  // Editing a pending message may replace this date; omission preserves it.
  optional int32 schedule_date = 17;
  // Positive server-assigned version of the complete authorized body, including
  // metadata. Increases monotonically on body changes, independently of this
  // message's accept_seq, mutation event positions and user edit_date; never
  // wraps or reuses a value. Compare only for the same authenticated principal,
  // target and message_id. When both copies report it, the larger revision is
  // fresher; equal revisions do not justify replacing a cached body. If either
  // copy omits it, use edit_date only as a fallback: later wins, and an absent
  // date never beats a dated one. Equal/absent dates do not order metadata-only
  // changes; retain the cached copy and reconcile rather than inventing a date.
  // Absence means unknown, never zero. A revision is not a cursor or receipt.
  optional int64 body_revision = 18;
  // Whether link preview generation is suppressed. Absent means unreported,
  // not false. A reported value is part of the complete message body.
  optional bool suppress_link_preview = 19;
  // Private pin state for this authenticated caller only; false means unpinned,
  // absent means unreported. Never disclose another user's personal pins or copy
  // this state across principals. Changes use viewer-only ACK markers/hints and
  // caller-relative body revisions; they do not change shared pinned or edit_date.
  optional bool personal_pin = 20;
}

// MessageReplyHeader contains reply context for a message.
message MessageReplyHeader {
  // Message being replied to in the source conversation.
  int64 reply_to_message_id = 1;
  int64 reply_to_peer_id = 2;
  // Thread root in the source conversation; zero when outside a thread.
  int64 thread_root_id = 3;
  string quote_text = 4;
  // Rich-text spans in quote_text, independent of source-message offsets.
  repeated Entity quote_entities = 5;
}

// MessageReplies contains thread reply summary for a message.
message MessageReplies {
  int32 replies = 1;
  int64 max_id = 2;
  int64 read_max_id = 3;
  repeated int64 recent_replier_ids = 4;
}

// Chat represents a group or channel entity.
message Chat {
  int64 chat_id = 1;
  string title = 2;
  ChatPhoto photo = 3;
  string about = 4;
  ChatType chat_type = 5;
  int32 participants_count = 6;
  google.protobuf.Timestamp date = 7;
  int64 owner_id = 8;
}

// ChatPhoto describes the current chat photo and its immutable completed files.
// A nonempty photo reports all three file/metadata/variant fields. File reads use
// ChatPhotoReference with this chat and photo_id, rechecking visibility and exact
// membership on each call. Replacement/removal invalidates that reference.
message ChatPhoto {
  // Positive photo identity, not a file ID; zero denotes no current photo.
  int64 photo_id = 1;
  // Whether the current photo includes video; an animated image is not video.
  bool has_video = 2;
  // Canonical main image file; zero only when there is no current photo.
  int64 file_id = 3;
  // Server-measured image facts and IMAGE version 1 validation result.
  ImageMetadata metadata = 4;
  // Completed server-published variants, ready with the main photo.
  repeated MediaVariant variants = 5;
}

// ChatDetails contains full chat details.
message ChatDetails {
  Chat chat = 1;
  repeated Participant participants = 2;
  repeated Participant admins = 3;
  repeated InviteLink invite_links = 4;
  repeated RestrictedUser restricted_users = 5;
  int32 ttl_period = 6;
}

// Participant represents a chat member.
message Participant {
  int64 user_id = 1;
  bool is_admin = 2;
  google.protobuf.Timestamp joined_at = 3;
}

// InviteLink represents a chat invite link.
message InviteLink {
  string link = 1;
  int64 admin_id = 2;
  google.protobuf.Timestamp date = 3;
  bool is_permanent = 4;
  bool is_revoked = 5;
  int32 usage_count = 6;
  optional int32 usage_limit = 7;
  optional google.protobuf.Timestamp expire_date = 8;
}

// RestrictedUser represents a user with restricted scopes.
message RestrictedUser {
  int64 user_id = 1;
  repeated ChatRestrictedScope restricted_scopes = 2;
  optional google.protobuf.Timestamp until_date = 3;
}

// Reaction represents an emoji reaction.
message Reaction {
  // Plain-text reaction, or the exact custom-emoji version's canonical nonempty
  // fallback (at most 64 UTF-8 bytes); validate equality at acceptance and retain it.
  string emoticon = 1;
  // Canonical CUSTOM_EMOJI asset ID, not a file ID. Zero selects emoticon.
  // A custom reaction requires a positive currently usable asset ID.
  int64 custom_emoji_id = 2;
  // Required positive exact version when custom_emoji_id is nonzero, absent
  // otherwise. Never substitute head. A visible message grants reads only while
  // this exact reaction is retained; unavailable assets render retained emoticon.
  optional uint64 asset_version = 3;
}

// MessageReactions contains per-message reaction summary.
message MessageReactions {
  int64 message_id = 1;
  repeated ReactionCount results = 2;
  repeated PeerReaction recent_reactions = 3;
}

// ReactionCount contains count for a single reaction type.
message ReactionCount {
  Reaction reaction = 1;
  int32 count = 2;
  bool chosen = 3;
}

// PeerReaction represents a single user's reaction.
message PeerReaction {
  int64 peer_id = 1;
  Reaction reaction = 2;
  google.protobuf.Timestamp date = 3;
}

// Media represents an attached media item on a message.
message Media {
  oneof media {
    Photo photo = 1;
    Document document = 2;
    GeoPoint geo = 3;
    MessageContact contact = 4;
    Poll poll = 5;
  }
}

// Photo represents a photo attachment.
// id is the photo's domain-object identifier and is not a file ID;
// file_id is the canonical reference to the stored full-size image bytes.
// access_hash does not authorize FilesService operations.
message Photo {
  int64 id = 1;
  int64 access_hash = 2;
  int32 width = 3;
  int32 height = 4;
  // Canonical file ID of the full-size image bytes.
  int64 file_id = 5;
  // Server-published image metadata, when available.
  optional ImageMetadata metadata = 6;
  // Stored variants (thumbnails/previews); access-checked like the parent.
  repeated MediaVariant variants = 7;
}

// Document represents a file/document attachment.
// id is the document's domain-object identifier and is not a file ID;
// file_id is the canonical reference to the stored bytes. access_hash does not
// authorize FilesService operations.
message Document {
  int64 id = 1;
  int64 access_hash = 2;
  string mime_type = 3;
  int64 size = 4;
  string file_name = 5;
  // Canonical file ID of the stored bytes.
  int64 file_id = 6;
  // Server-published typed attributes of the document, when available.
  repeated MediaAttribute attributes = 7;
  // Stored variants (thumbnails/previews); access-checked like the parent.
  repeated MediaVariant variants = 8;
}

// GeoPoint represents a geographic location.
message GeoPoint {
  double lat = 1;
  double long = 2;
}

// MessageContact represents a contact card attached to a message.
message MessageContact {
  string phone_number = 1;
  string first_name = 2;
  string last_name = 3;
  int64 user_id = 4;
}

// Poll represents a poll attached to a message.
message Poll {
  int64 id = 1;
  string question = 2;
  repeated PollAnswer answers = 3;
  bool closed = 4;
  bool public_voters = 5;
  bool multiple_choice = 6;
  bool quiz = 7;
  // Current authorized aggregate and caller-relative choices. Correctness is
  // disclosed only after this caller votes or the poll closes, never in advance.
  PollResults results = 8;
}

// PollResults is one consistent aggregate snapshot, not a list of voter IDs.
message PollResults {
  // Number of distinct voters; a multiple-choice voter counts once.
  int32 total_voters = 1;
  // One entry per Poll.answers option, including options with zero votes.
  // Order matches Poll.answers; counts and chosen refer to this same snapshot.
  repeated PollAnswerResult results = 2;
}

// PollAnswerResult describes one option's count and the caller's selection.
message PollAnswerResult {
  // Exact opaque bytes of PollAnswer.option; never a text or numeric index.
  bytes option = 1;
  // Nonnegative number of voters choosing this option.
  int32 voters = 2;
  // Whether the authenticated caller currently chooses this option.
  bool chosen = 3;
  // Quiz correctness, omitted until disclosure is allowed and for non-quizzes.
  // Explicit false distinguishes a disclosed incorrect option from hidden data.
  optional bool correct = 4;
}

// PollAnswer represents a single poll option.
message PollAnswer {
  string text = 1;
  bytes option = 2;
}

// PollVoter represents a user's vote record.
message PollVoter {
  int64 user_id = 1;
  repeated bytes options = 2;
  google.protobuf.Timestamp date = 3;
}

// MissingInvitee represents a user that could not be invited.
message MissingInvitee {
  int64 user_id = 1;
  string reason = 2;
}

// =============================================================================
// Source types for media/reply (used by send operations)
// =============================================================================

// MediaSource represents the media content of a send or edit operation.
//
// `*Source` is the tinkle.v1 naming convention for client-provided content
// definitions: a source describes what an operation should use, and is
// never a server response object. File-backed sources reference an
// uploaded, completed Tinkle file — never a local path, URL, or unfinished
// upload. Clients process and upload the main file for the explicit source
// purpose; servers validate bytes and generate required thumbnails before
// publication as specified by MediaValidation. Metadata and variant references
// supplied by clients are untrusted inputs, never validation authority.
message MediaSource {
  oneof media {
    PhotoSource photo = 1;
    DocumentSource document = 2;
    GeoPointSource geo = 3;
    ContactSource contact = 4;
    PollSource poll = 5;
    VideoSource video = 6;
    AudioSource audio = 7;
    VoiceSource voice = 8;
    StickerSource sticker = 9;
  }
}

// PhotoSource defines a photo attachment satisfying IMAGE version 1. Chat photos
// use the same profile. Profile photos use ProfilePhotoSource's tighter bounds.
message PhotoSource {
  // Canonical file ID of an uploaded, completed image file.
  int64 file_id = 1;
  // Optional claims; if supplied, must match server-measured bytes and IMAGE
  // version 1. Omission does not bypass validation or thumbnail generation.
  optional ImageMetadata metadata = 2;
  // Optional completed caller-owned variant inputs under MediaVariantSource
  // rules; required published thumbnails are generated by the server.
  repeated MediaVariantSource variants = 3;
}

// DocumentSource defines a document attachment built from a completed file.
// With no attributes this is a raw document: retain the bytes unchanged, without
// normalization, automatic type selection by sniffing, or required thumbnails.
// Explicit attributes select typed media purposes and their validation policies:
// image uses IMAGE, video VIDEO, audio AUDIO or VOICE according to voice_message,
// sticker STRICT_LOSSLESS. At most one of each kind; duplicate or conflicting
// kinds are rejected. The typed sources select the same policies. A file that
// looks like an image remains a raw document unless a typed purpose is selected.
message DocumentSource {
  // Canonical file ID of an uploaded, completed file.
  int64 file_id = 1;
  // Explicit typed purpose claims; empty selects raw-document handling.
  repeated MediaAttribute attributes = 2;
  // Optional variant inputs; raw-document thumbnails are optional, never inferred.
  repeated MediaVariantSource variants = 3;
}

// VideoSource defines a video attachment satisfying VIDEO version 1.
message VideoSource {
  // Canonical file ID of an uploaded, completed video file.
  int64 file_id = 1;
  // Optional claims, verified against measured bytes and VIDEO version 1.
  optional VideoMetadata metadata = 2;
  // Optional variant inputs; a required video thumbnail is server-generated.
  repeated MediaVariantSource variants = 3;
}

// AudioSource defines an audio attachment satisfying AUDIO version 1.
message AudioSource {
  // Canonical file ID of an uploaded, completed audio file.
  int64 file_id = 1;
  // Optional claims, verified against measured bytes; voice_message must be false.
  optional AudioMetadata metadata = 2;
  // Optional completed cover inputs; audio does not require a thumbnail.
  repeated MediaVariantSource variants = 3;
}

// VoiceSource defines a voice message built from a completed file.
// Selects VOICE version 1, equivalent to an explicit voice audio attribute.
message VoiceSource {
  // Canonical file ID of an uploaded, completed voice recording.
  int64 file_id = 1;
  // Positive duration claim in milliseconds; must match the measured recording.
  uint64 duration_ms = 2;
  // Client-encoded waveform for inline voice rendering; opaque to the
  // server. Unset when the client did not generate one; an explicitly set
  // empty waveform is distinct from unset and serializes as present.
  optional bytes waveform = 3;
}

// StickerSource defines a sticker attachment built from a completed file.
// Without asset_id the main and variant files must be uploader-owned. With
// asset_id, require its exact asset_version to be owned or pinned in a currently
// published pack, with matching main file/variants/metadata; reject CUSTOM_EMOJI
// assets here. A message-context read grant alone cannot authorize a new send.
// Accepted messages retain these exact files independently of pack withdrawal,
// but message visibility is rechecked on each later read.
// Direct file sources use STRICT_LOSSLESS version 1 and StickerAssetSource's
// STICKER bounds, including required metadata. An asset reference reuses its
// validated generated thumbnail rather than replacing its exact files.
message StickerSource {
  // Canonical file ID of an uploaded, completed sticker image.
  int64 file_id = 1;
  // Required STRICT_LOSSLESS declaration and physical claims; when asset_id is
  // present these must exactly match that stored version's metadata.
  optional StickerMetadata metadata = 2;
  // Optional completed thumbnail inputs; STRICT_LOSSLESS bounds apply and the
  // required published thumbnail is server-generated.
  repeated MediaVariantSource variants = 3;
  // Positive StickerView.id when sending an authored asset, not a file ID.
  // Omit only when constructing a sticker directly from caller-owned files.
  optional int64 asset_id = 4;
  // Required positive exact version when asset_id is present; absent otherwise.
  // Never resolve an ID to a different catalog head during acceptance.
  optional uint64 asset_version = 5;
}

// GeoPointSource supplies geographic coordinates for sending.
message GeoPointSource {
  double lat = 1;
  double long = 2;
}

// ContactSource supplies a contact card for sending.
message ContactSource {
  string phone_number = 1;
  string first_name = 2;
  string last_name = 3;
  int64 user_id = 4;
}

// PollSource supplies a poll definition for sending.
message PollSource {
  string question = 1;
  repeated PollAnswer answers = 2;
  bool public_voters = 3;
  bool multiple_choice = 4;
  bool quiz = 5;
  optional int32 close_period = 6;
  optional google.protobuf.Timestamp close_date = 7;
  // Exact option bytes of correct quiz answers. A quiz requires exactly one,
  // must be single-choice, and it must match a declared answer. Non-quizzes
  // require an empty list. Answer options must be nonempty and distinct; polls
  // have 2..10 answers. close_period (positive seconds) and close_date (future
  // Unix time) are mutually exclusive. Correct answers are not echoed publicly.
  repeated bytes correct_answers = 8;
}

// ReplyInput represents reply context for send operations.
message ReplyInput {
  // Positive visible message ID being replied to in the send target.
  int64 reply_to_message_id = 1;
  string quote_text = 2;
  // Rich-text spans in quote_text, using the shared UTF-16 entity rules.
  repeated Entity quote_entities = 3;
  // Explicit thread root in the send target. Positive when present; the
  // reply_to_message_id must be that root or a reply belonging to it, and both
  // must be visible to the caller. Omit for an ordinary reply outside a thread.
  // Never infer a root from a quote or accept a root from another conversation.
  optional int64 thread_root_id = 4;
}

// ChatPhotoSource selects the photo for chat photo operations: it either
// references a completed file directly, removes the current photo, or
// supplies a full PhotoSource with metadata and variants.
message ChatPhotoSource {
  oneof input {
    // Canonical file ID of an uploaded, completed image file.
    int64 file_id = 1;
    // Remove the current photo.
    bool empty = 2;
    // Full photo source with client-asserted metadata and variants.
    PhotoSource photo = 3;
  }
}

// AlbumItem defines one media item and its caption in an album.
message AlbumItem {
  MediaSource media = 1;
  string message = 2;
  // Rich-text spans in this item's message caption.
  repeated Entity entities = 3;
  // Nonzero client-generated deduplication key, scoped to principal and target.
  int64 idempotency_key = 4;
}

// =============================================================================
// Dialog & History RPC messages
// =============================================================================

// GetDialogsRequest requests the authenticated user's dialog list.
// Supports cursor-based pagination and conditional fetching via hash.
message GetDialogsRequest {
  // space_id filters dialogs to a specific workspace/space. Omit to retrieve all.
  optional int64 space_id = 1;
  // offset_date is a Unix epoch timestamp (seconds) of the last dialog's top message date.
  // Used for cursor pagination: the server returns dialogs older than this date.
  // Omit or set to 0 for the first page.
  optional int32 offset_date = 2;
  // offset_peer_id is the target ID of the last dialog on the previous page.
  // Used together with offset_date for stable cursor pagination when multiple
  // dialogs share the same date.
  optional int64 offset_peer_id = 3;
  // limit is the maximum number of dialogs to return. Valid range: 1–100.
  // If omitted, the server uses a default (typically 20).
  optional int32 limit = 4;
  // hash is a client-computed checksum of the previously received dialog list.
  // If the server's current hash matches, it returns an empty response (unchanged).
  // Compute as: XOR of all (dialog target id * 0x2491 + dialog.top_message) values.
  // Set to 0 to always receive the full list.
  int64 hash = 5;
  // cursor is an opaque continuation token from a previous next_cursor value.
  // Omit or leave empty to use the existing first-page or legacy offset behavior.
  // A nonempty cursor is mutually exclusive with offset_date and offset_peer_id;
  // omit both legacy offsets when supplying it. Cursor pagination follows the
  // server's pinned-first activity ordering. Keep the exact space_id scope unchanged
  // across pages, including whether it was omitted; changing folders requires
  // restarting without a cursor. The dialog list is live, not a snapshot: activity
  // and pin changes can move dialogs across page boundaries between requests.
  optional string cursor = 6;
}

// GetDialogsResponse is the response for GetDialogs.
message GetDialogsResponse {
  repeated Dialog dialogs = 1;
  repeated Message messages = 2;
  repeated User users = 3;
  repeated Chat chats = 4;
  // next_cursor is an opaque token to pass unchanged as the next request's cursor.
  // A nonempty token means pagination may continue, even when privacy filtering
  // leaves this page shorter than limit or empty. Do not infer exhaustion from the
  // number of returned dialogs. An absent or empty token provides no continuation;
  // existing hash-based unchanged-response semantics still apply.
  optional string next_cursor = 5;
}

// GetHistoryRequest requests message history for a conversation.
// Supports bidirectional cursor pagination within a conversation.
message GetHistoryRequest {
  // target identifies the conversation to fetch history from (required).
  Target target = 1;
  // offset_id is the message ID to start pagination from.
  // The server returns messages around this ID based on add_offset and limit.
  optional int64 offset_id = 2;
  // offset_date is a Unix epoch timestamp (seconds). When set, the server
  // returns messages sent before this date. Mutually exclusive with offset_id.
  optional int32 offset_date = 3;
  // add_offset shifts the result window relative to offset_id.
  // Negative values fetch messages newer than offset_id;
  // positive values fetch older messages. Example: add_offset=-20 with
  // limit=20 fetches the 20 messages after offset_id.
  int32 add_offset = 4;
  // limit is the maximum number of messages to return. Valid range: 1–100.
  int32 limit = 5;
  // max_id returns only messages with IDs less than or equal to this value.
  // Used to define the upper bound of the result window.
  optional int64 max_id = 6;
  // min_id returns only messages with IDs greater than or equal to this value.
  // Used to define the lower bound of the result window.
  optional int64 min_id = 7;
}

// GetHistoryResponse is the response for GetHistory.
message GetHistoryResponse {
  repeated Message messages = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
  int32 count = 4;
  optional int64 offset_id_offset = 5;
  // more_available reports continuation beyond the returned window in the
  // direction the request paginated. Set true confirms more history exists;
  // set false is the server's confirmation that none does in that direction.
  // Absent means this page carries no continuation report: that is unknown,
  // never a terminal stop, and the client keeps paging under its own means
  // (offset_id_offset or the window's edge message_id; count stays
  // informational). Presence is what distinguishes an unreported page from a
  // confirmed boundary.
  optional bool more_available = 6;
}

// GetMessagesRequest fetches specific messages by ID in one conversation.
message GetMessagesRequest {
  // target identifies the conversation the IDs belong to (required). All IDs
  // must reference this same conversation.
  Target target = 1;
  // message_ids lists message IDs to retrieve, at most 100 per request.
  // Requests exceeding this bound are rejected rather than truncated, so
  // clients must batch in groups of at most 100.
  repeated int64 message_ids = 2;
}

// GetMessagesResponse contains the retrieved messages with entity hydration
// identical in shape to GetHistoryResponse. Messages that cannot be disclosed
// in full (unknown ID, deleted, revoked, or below the caller's history
// visibility) are omitted rather than reported as errors; omitted IDs carry no
// information about their past existence or deletion reason. Returned order is
// unspecified. A body fetch shares the message's accept_seq token, which is
// stable across edits — the token identifies the message within the
// conversation; it cannot rank copies. For the same principal/target/message_id,
// compare body_revision when both copies report it. Only if either revision is
// absent, fall back to edit_date as described on Message.body_revision; metadata
// changes do not create user edit dates. Learn retained body/metadata/removal
// events through ListMessageChanges, not by diffing fetched bodies.
message GetMessagesResponse {
  repeated Message messages = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// ListMessageChangesRequest lists retained conversation mutations strictly after
// one acceptance position. The journal keeps mutations at their original
// acceptance order; use this to reconcile body/metadata changes and removals
// without a durable update feed. Positions order mutations across messages in
// this conversation, not versions or identities of an individual message.
message ListMessageChangesRequest {
  // target identifies the conversation whose changes are listed (required).
  Target target = 1;
  // after_accept_seq is the exclusive lower bound on the conversation's
  // mutation acceptance positions. Positions start at one; zero requests
  // everything retained and is the initial cursor. No other paging state is
  // honored.
  int64 after_accept_seq = 2;
  // limit bounds one response, 1..500. Zero chooses the deployment's default.
  // Server budgets may shorten a page further, in which case more_available is set.
  int32 limit = 3;
}

// ListMessageChangesResponse carries one page of retained conversation mutations.
message ListMessageChangesResponse {
  // Authorized markers ordered ascending by mutation accept_seq. EDITED, PIN,
  // REACTION, POLL and viewer-only ACK hydrate the currently visible body;
  // DELETED/REVOKED never disclose a removed body. Recheck current authorization
  // for markers and hydration; ACK state is never disclosed to another viewer.
  // Positions need not be contiguous: authorization filtering, retention and
  // settled non-change positions can leave gaps. Nothing before the retained
  // boundary is reconstructed here; gaps/absence prove neither nonexistence nor
  // complete repair. Use authoritative message/history fetches for reconciliation,
  // including when the caller's visibility scope changes.
  repeated TargetChange changes = 1;
  // Reports further settled retained journal positions to examine after
  // last_accept_seq. True confirms another available page, possibly empty after
  // authorization filtering; continue with after_accept_seq=last_accept_seq.
  // False means none are currently available through that horizon, not that
  // pending mutations are absent or all history was retained. An unsettled earlier
  // position can hold the horizon; poll again from the returned cursor. Absence
  // is an unknown continuation state.
  optional bool more_available = 2;
  // Stable processed boundary, never below the request cursor or a returned
  // marker. May advance beyond the last visible marker, even on an empty page,
  // through settled filtered/retained positions. Never advance across a pending
  // earlier mutation that could later become visible behind this boundary.
  // If no progress is possible, echo after_accept_seq unchanged. Continue only
  // from this value, not the largest message ID, body revision, returned marker,
  // or unprocessed allocated head. It is not proof of gapless retained history.
  int64 last_accept_seq = 3;
}

// TargetChange is one retained conversation mutation at one acceptance position.
message TargetChange {
  // message_id identifies the message the change applies to.
  int64 message_id = 1;
  // Body/metadata change or removal; ACK is disclosed only to its own viewer.
  TargetChangeKind kind = 2;
  // Authorized hydrated current body for EDITED, PIN, REACTION, POLL or ACK,
  // unless body_invalidated explicitly reports authorized identity-only invalidation;
  // never a body for DELETED/REVOKED. Recheck current visibility before hydration.
  // Its body_revision may be newer than this marker's message_revision; do not
  // replace it with the event revision. Its accept_seq stays the message's own
  // acceptance token, not this mutation's position. No synthetic edit_date.
  Message message = 3;
  // accept_seq is the acceptance position of this mutation within the
  // conversation: positive and ordered across message mutations, not an identity
  // or per-message revision. Filtering, retention and the pending-position horizon
  // preclude inferring continuity from numeric gaps. Resume using the response's
  // stable last_accept_seq, not this marker alone.
  int64 accept_seq = 4;
  // Positive exact per-message revision produced by this event, when reported;
  // absence is unknown, not zero. Distinct from its journal position. Hydration
  // is current, not an event-time snapshot: a reported message.body_revision may
  // be equal or newer, never older. Removal markers can report a revision without
  // disclosing a body. Do not label a hydrated newer body with this event revision.
  optional int64 message_revision = 5;
  // Source-authorized canonical identity (caller, request target, message_id)
  // for a nonterminal change whose current body is withheld. Requires positive
  // message_id/message_revision, message absent and a nonterminal kind, never
  // UNSPECIFIED, DELETED or REVOKED. Retain a nonterminal revision floor and purge
  // cached bodies and file references at or below that revision. Reject stale or
  // unknown-revision held responses; a fresh currently authorized source body at
  // the same or newer revision may hydrate. This is not a viewer deletion and
  // not permission proof. An absent message without true body_invalidated does
  // not establish invalidation or removal.
  bool body_invalidated = 6;
}

// MessageChanged is a typed notification payload, not a transport envelope,
// journal cursor, delivery receipt or authoritative body/removal record. Runtime
// bindings own routing and delivery. Hints may duplicate, coalesce, arrive late or
// be missed; reconcile through authorized fetches/ListMessageChanges, including on
// reconnect without a hint. Recheck recipient visibility at delivery. ACK hints
// are private to the viewer whose acknowledgement metadata changed, never fanout
// to other conversation participants. A hint grants no access or proof of receipt.
message MessageChanged {
  // Required conversation whose visibility must be checked for this recipient.
  Target target = 1;
  // Positive message ID within target, not a globally comparable position.
  int64 message_id = 2;
  // Positive revision associated with the hinted change; a fetch may be newer.
  // Compare only within the same principal/target/message_id, never as a cursor.
  int64 body_revision = 3;
  // Disclosed body/metadata/removal kind; never UNSPECIFIED for a valid hint.
  TargetChangeKind change_kind = 4;
  // Optional expiring animation on a REACTION hint; absence requests no effect.
  // Deduplicate actor_id/operation_id and discard after expiry, independently
  // of reconciling the current reaction body.
  ReactionEffect reaction_effect = 5;
  // A non-authoritative hint of nonterminal body withholding for the source's
  // canonical identity (caller, target, message_id). Reconcile with the current source
  // before applying an authoritative invalidation or revision floor; this hint is
  // not permission proof and does not establish a viewer deletion. Requires a
  // positive body_revision and nonterminal change_kind; no reaction_effect or
  // body content accompanies it. Only current-source authorization permits hydration.
  bool body_invalidated = 6;
}

// ReactionEffect is presentation metadata, never a message or asset access grant.
// Recheck current recipient visibility before delivery; clients discard expired
// effects. Never replay presentation from body hydration or durable change markers.
// Render only source-validated metadata: positive authenticated actor_id, canonical
// operation UUID and a finite unexpired deadline. Invalid metadata requests no effect.
message ReactionEffect {
  // Canonical caller-scoped UUID; never animate this actor_id/operation_id twice.
  string operation_id = 1;
  // Authenticated original reacting account.
  int64 actor_id = 2;
  // Original fixed deadline, never extended by delivery or reconnect.
  google.protobuf.Timestamp expires_at = 3;
  // Exact Unicode/custom-version choices, at most eight.
  repeated Reaction reactions = 4;
}

// TypingChanged is an ephemeral typed notification payload, independent of its
// envelope or delivery transport. It is not presence, a durable event or a
// receipt. Deliver only to currently authorized recipients in target/thread;
// recheck membership/visibility and applicable privacy. Discard expired hints,
// do not replay them after reconnect, and never extend expiry from arrival time.
message TypingChanged {
  // Required conversation currently visible to the recipient.
  Target target = 1;
  // Positive actor user ID derived from the actor's trusted session, not a claim.
  int64 actor_id = 2;
  // Typing/media activity; CANCEL clears this actor's target/thread immediately.
  TypingAction action = 3;
  // Required finite absolute server expiry; clients clear the indicator by this
  // deadline without needing a cancellation hint. CANCEL clears it immediately.
  google.protobuf.Timestamp expires_at = 4;
  // Positive thread root when activity is thread-scoped; omit for conversation scope.
  optional int64 thread_root_id = 5;
}

// MarkHistoryReadRequest marks messages as read in a conversation.
message MarkHistoryReadRequest {
  Target target = 1;
  int64 max_id = 2;
}

// MarkHistoryReadResponse confirms the read state update.
message MarkHistoryReadResponse {
  bool success = 1;
}

// DeleteHistoryRequest deletes a fixed range through a resumable operation.
// The first accepted call freezes the eligible message set at its acceptance
// horizon; later messages never enter it. Each call performs bounded work. Retry
// the same operation_id and identical parameters to continue or recover the
// outcome; concurrent retries serialize progress without duplicate effects.
// Recheck current authorization before every effect. Timeout, cancellation or
// failure is not rollback; recover using this same request, not a new operation.
// Operation identity is bound to the caller, method and exact parameters,
// including optional presence; conflicts fail without effect. A retained terminal
// outcome is stable. An expired operation is rejected and never restarts under
// the same ID; retention duration is server policy. No background job API is implied.
// Recovery keeps the original filters and frozen source selection, never a new
// selection reconstructed from later client caches or the peer's history.
message DeleteHistoryRequest {
  // Required visible conversation, never a global selection.
  Target target = 1;
  // Inclusive upper message ID; zero selects the acceptance horizon's last ID.
  int64 max_id = 2;
  // If true, revoke the sender's own messages for everyone; incoming messages
  // are removed for the caller only. False/absence removes all selected messages
  // for the caller only: the peer's history is unchanged. Never grants authority
  // to revoke another sender's messages or modify the peer's read state.
  optional bool revoke = 3;
  // Inclusive lower Unix-seconds bound on original message date, when present.
  optional int32 min_date = 4;
  // Inclusive upper Unix-seconds bound; cannot precede min_date.
  optional int32 max_date = 5;
  // Required client-generated UUID, persisted before the first call. Reuse only
  // for this exact history selection; never reuse across principals.
  string operation_id = 6;
}

// DeleteHistoryResponse is one consistent operation-progress snapshot.
message DeleteHistoryResponse {
  // Whether this call was accepted successfully; not evidence of completion.
  bool success = 1;
  // Informational remaining-work estimate, not a cursor or completion signal.
  int32 offset = 2;
  // Exact request operation_id; stable across progress and recovery calls.
  string operation_id = 3;
  // Always reported: true only when every selected message has been processed.
  // False means retry the identical request; absence is unknown, never complete.
  optional bool completed = 4;
  // Cumulative distinct selected messages processed, including already absent
  // messages; monotonically nondecreasing, stable once completed. Not a percentage
  // or a count of globally revoked messages. Discloses no hidden incoming history.
  uint64 processed_count = 5;
}

// DeleteMessagesRequest deletes specific messages independently, not atomically
// as a batch. Each item is authorized separately; unknown, inaccessible or
// ineligible IDs have no effect and do not prevent deletion of eligible items.
message DeleteMessagesRequest {
  // Required conversation containing every selected ID.
  Target target = 1;
  // Message IDs to delete; each distinct eligible ID is counted at most once.
  repeated int64 message_ids = 2;
  // True revokes only the caller's own messages for everyone; incoming messages
  // are removed for the caller only. False/absence removes for the caller only.
  optional bool revoke = 3;
}

// DeleteMessagesResponse reports the result of independent item deletions.
message DeleteMessagesResponse {
  // Messages newly removed for the caller by this call. Unknown, inaccessible,
  // ineligible and already removed IDs do not increase the count; no per-ID
  // existence or failure details are disclosed.
  int32 deleted_count = 1;
}

// =============================================================================
// Chat Creation & Structure RPC messages
// =============================================================================

// CreateChatRequest specifies the initial state of a new group chat.
message CreateChatRequest {
  string title = 1;
  repeated int64 user_ids = 2;
  optional int32 ttl_period = 3;
  // Required when ttl_period > 0: a positive int64 retry key scoped to actor/method.
  // Zero permits an unkeyed request only when ttl_period is absent or zero;
  // negative keys are invalid. Retry uncertain completion with the original key
  // and identical arguments. This is a numeric key, not a UUID string.
  int64 operation_id = 4;
}

// CreateChatResponse is the response for CreateChat.
message CreateChatResponse {
  Chat chat = 1;
  repeated User users = 2;
  repeated MissingInvitee missing = 3;
}

// EditChatTitleRequest updates a chat's title.
message EditChatTitleRequest {
  int64 chat_id = 1;
  string title = 2;
}

// EditChatTitleResponse confirms the title update.
message EditChatTitleResponse {
  bool success = 1;
}

// EditChatPhotoRequest updates or removes a chat's photo.
message EditChatPhotoRequest {
  int64 chat_id = 1;
  ChatPhotoSource photo = 2;
  // Positive retry key scoped to the authenticated actor. Required for publishing
  // a new photo; reuse with different input is rejected. Retry after a timeout
  // with the same key: cancellation does not prove rollback.
  int64 operation_id = 3;
}

// EditChatPhotoResponse confirms the photo update.
message EditChatPhotoResponse {
  bool success = 1;
}

// UpdateChatDescriptionRequest updates a chat's description.
message UpdateChatDescriptionRequest {
  int64 chat_id = 1;
  // New chat description; an empty string clears it.
  string description = 2;
}

// UpdateChatDescriptionResponse confirms the description update.
message UpdateChatDescriptionResponse {
  bool success = 1;
}

// GetChatsRequest requests basic info for multiple chats by ID.
message GetChatsRequest {
  repeated int64 chat_ids = 1;
}

// GetChatsResponse is the response for GetChats.
message GetChatsResponse {
  repeated Chat chats = 1;
}

// GetChatDetailsRequest requests full details for a specific chat.
message GetChatDetailsRequest {
  int64 chat_id = 1;
}

// GetChatDetailsResponse is the response for GetChatDetails.
message GetChatDetailsResponse {
  // Complete details for the requested chat.
  ChatDetails chat_details = 1;
}

// =============================================================================
// Participants & Scopes RPC messages
// =============================================================================

// AddChatParticipantRequest adds a user to a group chat.
message AddChatParticipantRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
  int32 forward_limit = 3;
  // Required when forward_limit > 0: a positive int64 retry key scoped to actor/method.
  // Zero permits an unkeyed add only when forward_limit is zero; negative keys
  // are invalid. A retry never rejoins a removed user. Retain the original numeric
  // key and arguments on recovery; this is not a UUID string.
  int64 operation_id = 4;
}

// AddChatParticipantResponse is the response for AddChatParticipant.
message AddChatParticipantResponse {
  repeated MissingInvitee missing = 1;
  repeated User users = 2;
}

// RemoveChatParticipantRequest removes a user from a group chat.
message RemoveChatParticipantRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
}

// RemoveChatParticipantResponse confirms removal.
message RemoveChatParticipantResponse {
  bool success = 1;
}

// EditChatAdminRequest promotes or demotes a chat admin.
message EditChatAdminRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
  bool is_admin = 3;
}

// EditChatAdminResponse confirms the admin update.
message EditChatAdminResponse {
  bool success = 1;
}

// EditChatRestrictedScopesRequest applies restricted permissions to a user in a chat.
message EditChatRestrictedScopesRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
  repeated ChatRestrictedScope restricted_scopes = 3;
  optional google.protobuf.Timestamp until_date = 4;
}

// EditChatRestrictedScopesResponse confirms the scopes update.
message EditChatRestrictedScopesResponse {
  bool success = 1;
}

// =============================================================================
// TTL, Pinned, Scheduled RPC messages
// =============================================================================

// SetHistoryTTLRequest configures auto-delete timer for a conversation.
message SetHistoryTTLRequest {
  Target target = 1;
  int32 period = 2;
}

// SetHistoryTTLResponse confirms the TTL update.
message SetHistoryTTLResponse {
  bool success = 1;
}

// SetMessagePinRequest pins or unpins a visible message in one scope.
// Shared changes require conversation pin permissions; personal changes affect
// the authenticated caller only and require current message visibility. Personal
// changes never notify other participants or change their pin state.
message SetMessagePinRequest {
  Target target = 1;
  int64 message_id = 2;
  // Suppress participant notification for a shared pin; personal pins never fan out.
  optional bool silent = 3;
  // True unpins, false/absence pins in the selected scope.
  optional bool unpin = 4;
  // Selected pin state; absence selects SHARED. Reject explicit UNSPECIFIED and
  // unknown values. PERSONAL changes only Message.personal_pin, SHARED only pinned.
  optional PinScope pin_scope = 5;
}

// SetMessagePinResponse confirms the pin update.
message SetMessagePinResponse {
  bool success = 1;
}

// UnpinAllMessagesRequest unpins shared pins in a conversation or thread;
// personal pins are unaffected. Requires shared pin permissions.
message UnpinAllMessagesRequest {
  Target target = 1;
  // Optional positive thread root limiting the shared pins to remove.
  optional int64 thread_root_id = 2;
}

// UnpinAllMessagesResponse reports the number of messages unpinned.
message UnpinAllMessagesResponse {
  int32 unpinned_count = 1;
}

// =============================================================================
// Sending & Editing RPC messages
// =============================================================================

// SendMessageRequest is the request to send a text message.
message SendMessageRequest {
  Target target = 1;
  string message = 2;
  // Nonzero client-generated key scoped to principal and target; identical
  // retained retries return the original message, conflicting content is rejected.
  int64 idempotency_key = 3;
  optional ReplyInput reply_to = 4;
  // Sender-selected silent notification preference, not a peer read acknowledgement.
  optional bool silent = 5;
  // Whether forwarding of the accepted message is restricted.
  optional bool forwarding_restricted = 6;
  // Clear only the authenticated sender's exact DM or room draft source pair
  // below after accepted send or durable scheduling; never recapture it on retry.
  optional bool clear_draft = 7;
  // Rich-text spans in message, using the shared UTF-16 entity rules.
  repeated Entity entities = 8;
  // Future Unix seconds to queue delivery; omit for immediate acceptance.
  optional int32 schedule_date = 9;
  // Exact dialog generation to clear when clear_draft=true. Retain on retries.
  optional int64 clear_draft_dialog_id = 10;
  // Exact draft revision in that generation, including zero; never a late clear.
  optional int64 clear_draft_revision = 11;
}

// SendMessageResponse is the response for SendMessage.
message SendMessageResponse {
  Message message = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// SendMediaRequest is the request to send a media message.
message SendMediaRequest {
  Target target = 1;
  MediaSource media = 2;
  optional string message = 3;
  // Nonzero client-generated key scoped to principal and target; identical
  // retained retries return the original message, conflicting content is rejected.
  int64 idempotency_key = 4;
  optional ReplyInput reply_to = 5;
  // Sender-selected silent notification preference, not a peer read acknowledgement.
  optional bool silent = 6;
  // Whether forwarding of the accepted message is restricted.
  optional bool forwarding_restricted = 7;
  // Clear only the authenticated sender's exact DM or room draft source pair
  // below after accepted send or durable scheduling; never recapture it on retry.
  optional bool clear_draft = 8;
  // Rich-text spans in message, used as the media caption.
  repeated Entity entities = 9;
  // Future Unix seconds to queue delivery; omit for immediate acceptance.
  optional int32 schedule_date = 10;
  // Exact dialog generation to clear when clear_draft=true. Retain on retries.
  optional int64 clear_draft_dialog_id = 11;
  // Exact draft revision in that generation, including zero; never a late clear.
  optional int64 clear_draft_revision = 12;
}

// SendMediaResponse is the response for SendMedia.
message SendMediaResponse {
  Message message = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// SendAlbumRequest sends 2..10 photo/video/document items as one album.
// Every idempotency_key must be nonzero and distinct; retries of the exact same
// principal/target/idempotency_key tuple return the original items, not another album.
// Conflicting content for a retained idempotency_key is rejected. Polls, contacts,
// geo points, voice messages, and stickers are not album items.
message SendAlbumRequest {
  Target target = 1;
  // Album items in acceptance order; validate all before atomic publication.
  repeated AlbumItem items = 2;
  optional ReplyInput reply_to = 3;
  // Sender-selected silent notification preference shared by all album items.
  optional bool silent = 4;
  // Whether forwarding of every accepted album item is restricted.
  optional bool forwarding_restricted = 5;
  // Clear only the authenticated sender's exact DM or room draft source pair
  // below through one group obligation after acceptance or durable scheduling.
  optional bool clear_draft = 6;
  // Future Unix seconds shared by every item; omit for immediate acceptance.
  optional int32 schedule_date = 7;
  // Exact dialog generation to clear when clear_draft=true. Retain on retries.
  optional int64 clear_draft_dialog_id = 8;
  // Exact draft revision in that generation, including zero; never a late clear.
  optional int64 clear_draft_revision = 9;
}

// SendAlbumResponse is the response for SendAlbum.
message SendAlbumResponse {
  repeated Message messages = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// EditMessageRequest edits an existing message's content or media.
message EditMessageRequest {
  Target target = 1;
  int64 message_id = 2;
  optional string message = 3;
  optional MediaSource media = 4;
  // Rich-text spans in message, including a replacement media caption.
  repeated Entity entities = 5;
  // Present true suppresses link previews, false permits them; omission preserves
  // existing state. Returned as Message.suppress_link_preview when reported.
  optional bool suppress_link_preview = 6;
  // Future Unix seconds replacing a pending message's delivery date. Omission
  // preserves it; setting this on a delivered message is rejected.
  optional int32 schedule_date = 7;
}

// EditMessageResponse is the response for EditMessage.
message EditMessageResponse {
  Message message = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// SetTypingRequest broadcasts a typing indicator to conversation participants.
message SetTypingRequest {
  Target target = 1;
  TypingAction action = 2;
  // Positive thread root for thread-scoped activity; omit for conversation scope.
  optional int64 thread_root_id = 3;
}

// SetTypingResponse acknowledges the typing indicator.
message SetTypingResponse {
  bool success = 1;
}

// StartBotRequest starts a bot interaction with a start parameter.
message StartBotRequest {
  Target bot = 1;
  Target target = 2;
  string start_param = 3;
  // Nonzero deduplication key scoped to principal and target for this interaction.
  int64 idempotency_key = 4;
}

// StartBotResponse is the response for StartBot.
message StartBotResponse {
  Message message = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// =============================================================================
// Search RPC messages
// =============================================================================

// SearchRequest is the request for Search.
message SearchRequest {
  // Omit to search all conversations currently visible to the caller. A present
  // empty Target is invalid, never global. thread_root_id, min_id, max_id,
  // offset_message_id and nonzero offset_id/add_offset require a target;
  // global pagination uses cursor only.
  Target target = 1;
  // Literal case-insensitive substring of message text or caption, at most 1024
  // UTF-8 bytes. No query operators, tokenization, regex or wildcard syntax:
  // punctuation, percent and underscore are literal. Empty selects by filters
  // alone. Unicode case handling can differ by backend; matching parity between
  // server index and local cache is not guaranteed.
  string query = 2;
  optional Target from_target = 3;
  // Positive visible thread root restricting results within target.
  optional int64 thread_root_id = 4;
  MessagesFilter filter = 5;
  int32 min_date = 6;
  int32 max_date = 7;
  int32 offset_id = 8;
  int32 add_offset = 9;
  // Page size 1..100; zero selects the default 50. Other values are invalid.
  int32 limit = 10;
  optional int64 max_id = 11;
  optional int64 min_id = 12;
  // Opaque continuation from next_cursor, passed unchanged. Empty/absent starts
  // a search; a nonempty cursor excludes offset_message_id and nonzero
  // offset_id/add_offset. Cursors
  // bind the caller, exact target presence/value, query, sender, thread, filter,
  // date and ID bounds. Changing scope or using an expired/foreign cursor is
  // rejected; restart without a cursor. Page size may change per page.
  // A continuation belongs to the selected backend, never a different source.
  // Global message IDs are not comparable: continue only with this cursor.
  // Recovery preserves the selected source and original filters; changing either
  // restarts without a cursor, never reuses another source's continuation.
  optional string cursor = 13;
  // Full-width conversation-local offset. Positive when present; mutually
  // exclusive with nonzero offset_id and with a nonempty cursor. Applies the
  // same add_offset/window semantics as offset_id, without int32 truncation.
  // Clients may instead use opaque cursor pagination for all search scopes.
  optional int64 offset_message_id = 14;
}

// SearchResponse is shared by server and local-cache search, with full Message
// bodies rather than a separate hit projection. Within a target/source results
// follow stable descending source acceptance order, not edit time or relevance.
// Global results use a source-defined deterministic order across targets, with
// stable target/message identity tie-breakers; target-local acceptance positions
// are never globally comparable. An absent accept_seq supplies no ordering vote.
// Continue using the selected source's cursor, not a client-invented global offset.
// Source and coverage qualify every page; neither implies matching parity.
message SearchResponse {
  // Full authorized messages, preserving entities, media and body revisions.
  repeated Message messages = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
  int32 count = 4;
  optional int32 next_rate = 5;
  // Opaque continuation for the same search, set iff more_available is true.
  // Privacy filtering can yield an empty page with continuation. Results are
  // live, not a snapshot; clients deduplicate by (target, message_id).
  optional string next_cursor = 6;
  // Continuation in the selected backend: false means that backend is exhausted,
  // absent means unknown. Cache exhaustion still has CACHED_SUBSET coverage, never
  // proves server exhaustion. Conforming responses always set this field.
  // count/next_rate are informational, not evidence of another cursor page.
  optional bool more_available = 7;
  // Selected backend; UNSPECIFIED (including absence) means unknown.
  SearchSource source = 8;
  // Searched corpus; UNSPECIFIED (including absence) means unknown. INDEXED is not
  // a snapshot or a guarantee that every authorized message is already indexed.
  SearchCoverage coverage = 9;
}

// =============================================================================
// Reactions RPC messages
// =============================================================================

// BatchGetMessageReactionsRequest requests reaction summaries for multiple messages.
message BatchGetMessageReactionsRequest {
  Target target = 1;
  repeated int64 message_ids = 2;
}

// BatchGetMessageReactionsResponse is the response for BatchGetMessageReactions.
message BatchGetMessageReactionsResponse {
  repeated MessageReactions reactions = 1;
}

// ListMessageReactionsRequest requests individual reactors for a message.
message ListMessageReactionsRequest {
  Target target = 1;
  int64 message_id = 2;
  optional Reaction reaction = 3;
  optional string offset = 4;
  int32 limit = 5;
}

// ListMessageReactionsResponse is the response for ListMessageReactions.
message ListMessageReactionsResponse {
  repeated PeerReaction reactions = 1;
  int32 count = 2;
  optional string next_offset = 3;
  repeated User users = 4;
}

// SendReactionRequest replaces the authenticated caller's choices on a message.
// Presentation and recents options are caller-scoped, not another sender's policy.
// Absence or false disables each optional side effect, not the reaction update.
message SendReactionRequest {
  Target target = 1;
  int64 message_id = 2;
  repeated Reaction reactions = 3;
  // Whether clients should animate the reaction effect.
  optional bool animate = 4;
  // Whether to save chosen identities for the authenticated caller only.
  optional bool save_to_recents = 5;
  // Canonical caller-scoped client UUID, required when animate or save_to_recents is true.
  // Persist before the first call and retain the exact parameters on every retry.
  string operation_id = 6;
}

// GetRecentReactionsRequest selects only the authenticated caller's collection.
// No user selector or cross-principal lookup; retained identities grant no asset access.
message GetRecentReactionsRequest {}

// GetRecentReactionsResponse returns at most 32 exact retained reaction identities.
message GetRecentReactionsResponse {
  // Most recently used first; versions never follow current catalog heads.
  repeated Reaction reactions = 1;
}

// SendReactionResponse is the response for SendReaction.
message SendReactionResponse {
  Message message = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// GetUnreadMentionsRequest requests messages mentioning the authenticated user.
message GetUnreadMentionsRequest {
  Target target = 1;
  // Optional positive thread root restricting unread mentions.
  optional int64 thread_root_id = 2;
  int64 offset_id = 3;
  int32 add_offset = 4;
  int32 limit = 5;
  optional int64 max_id = 6;
  optional int64 min_id = 7;
}

// GetUnreadMentionsResponse is the response for GetUnreadMentions.
message GetUnreadMentionsResponse {
  repeated Message messages = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
  int32 count = 4;
}

// ReadMentionsRequest marks all mentions in a conversation as read.
message ReadMentionsRequest {
  Target target = 1;
  // Optional positive thread root restricting acknowledgement scope.
  optional int64 thread_root_id = 2;
}

// ReadMentionsResponse confirms mentions are read.
message ReadMentionsResponse {
  bool success = 1;
}

// GetUnreadReactionsRequest requests messages with new reactions for the user.
message GetUnreadReactionsRequest {
  Target target = 1;
  // Optional positive thread root restricting unread reactions.
  optional int64 thread_root_id = 2;
  int64 offset_id = 3;
  int32 add_offset = 4;
  int32 limit = 5;
  optional int64 max_id = 6;
  optional int64 min_id = 7;
}

// GetUnreadReactionsResponse is the response for GetUnreadReactions.
message GetUnreadReactionsResponse {
  repeated Message messages = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
  int32 count = 4;
}

// ReadReactionsRequest marks all reactions in a conversation as read.
message ReadReactionsRequest {
  Target target = 1;
  // Optional positive thread root restricting acknowledgement scope.
  optional int64 thread_root_id = 2;
}

// ReadReactionsResponse confirms reactions are read.
message ReadReactionsResponse {
  bool success = 1;
}

// =============================================================================
// Polls & Votes RPC messages
// =============================================================================

// SendVoteRequest replaces the caller's selection; an empty list retracts it.
// Options must be distinct exact PollAnswer.option values; a single-choice
// poll accepts at most one. Closed polls reject changes. Quiz votes are final
// and cannot be changed or retracted after correctness has been disclosed.
message SendVoteRequest {
  Target target = 1;
  int64 message_id = 2;
  repeated bytes options = 3;
}

// SendVoteResponse is the response for SendVote.
message SendVoteResponse {
  Message message = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// GetPollVotesRequest requests per-option voter lists with pagination.
// Voter identities are disclosed only when Poll.public_voters is true; anonymous
// polls return no per-user records. GetPollResults still returns aggregates.
message GetPollVotesRequest {
  Target target = 1;
  int64 message_id = 2;
  optional bytes option = 3;
  optional string offset = 4;
  int32 limit = 5;
}

// GetPollVotesResponse is the response for GetPollVotes.
message GetPollVotesResponse {
  int32 count = 1;
  repeated PollVoter voters = 2;
  optional string next_offset = 3;
  repeated User users = 4;
}

// GetPollResultsRequest requests current poll results.
message GetPollResultsRequest {
  Target target = 1;
  int64 message_id = 2;
}

// GetPollResultsResponse carries current aggregates in message.media.poll.results.
// SendVoteResponse and message fetches use the same caller-relative projection.
message GetPollResultsResponse {
  Message message = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
}

// =============================================================================
// Threaded RPC messages
// =============================================================================

// ReadThreadRequest marks thread messages as read up to a specified ID.
message ReadThreadRequest {
  Target target = 1;
  // Required positive visible root of the thread being acknowledged.
  int64 thread_root_id = 2;
  int64 read_max_id = 3;
}

// ReadThreadResponse confirms thread messages are read.
message ReadThreadResponse {
  bool success = 1;
}

// ListThreadMessagesRequest requests thread replies with pagination.
message ListThreadMessagesRequest {
  Target target = 1;
  int64 message_id = 2;
  optional int64 offset_id = 3;
  optional int32 offset_date = 4;
  int32 add_offset = 5;
  int32 limit = 6;
  optional int64 max_id = 7;
  optional int64 min_id = 8;
}

// ListThreadMessagesResponse is the response for ListThreadMessages.
message ListThreadMessagesResponse {
  repeated Message messages = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
  int32 count = 4;
  optional int64 read_inbox_max_id = 5;
  optional int64 read_outbox_max_id = 6;
}
