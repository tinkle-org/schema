syntax = "proto3";

package tinkle.v1;

option go_package = "github.com/tinklehq/tinkle-proto/tinkle/v1;tinklev1";

// Owner-only refresh hint. Reauthorize and read GetPayment; not a receipt.
message PaymentChanged {
  // Neutral ID to refetch within the recipient's ledger partition.
  string payment_id = 1;
  // Positive revision of that payment, not an applied snapshot or operation outcome.
  uint64 revision = 2;
}

// Owner-only refresh hint. Reauthorize and read GetRefund; not a refund decision.
message RefundChanged {
  // Neutral ID to refetch within the recipient's ledger partition.
  string refund_id = 1;
  // Positive revision of that refund.
  uint64 revision = 2;
}

// Refetch GetMyEntitlements for the receiving account and partition. No grant or launch permission.
message MyEntitlementsChanged {
  // Positive owner-only entitlement revision; identity is implicit, never another account.
  uint64 revision = 1;
}
