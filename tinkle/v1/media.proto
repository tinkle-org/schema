// Media Types — Shared media metadata, attributes, and file variants.
//
// Contains the typed media metadata and file-variant vocabulary shared by
// the file-transfer and messaging contracts. Everything here describes
// application-level media; authoritative storage facts about the underlying
// bytes live in FileInfo (files.proto).
//
// Naming conventions used across tinkle.v1:
//   - `*Metadata` messages and `MediaAttribute` describe media content.
//     Metadata supplied by clients is an explicit claim, never a server
//     verification. Returned physical facts and validation results are
//     server-measured from the completed bytes, never copied as authority.
//   - `MediaVariant` is a server-published alternative representation of a
//     completed file (for example a thumbnail).
//   - `MediaVariantSource` is an optional client-supplied completed variant
//     input; required thumbnails are server-generated before publication.
syntax = "proto3";

package tinkle.v1;

option go_package = "github.com/tinklehq/tinkle-proto/tinkle/v1;tinklev1";

// MediaVariantRole describes the role an image variant plays for its parent
// media attachment. Servers validate allowed roles per attachment kind.
enum MediaVariantRole {
  // Unspecified; rejected by servers.
  MEDIA_VARIANT_ROLE_UNSPECIFIED = 0;
  // Small thumbnail used in lists and previews.
  MEDIA_VARIANT_ROLE_THUMBNAIL = 1;
  // Medium preview shown while the full-size image downloads.
  MEDIA_VARIANT_ROLE_PREVIEW = 2;
  // Largest or full-size representation.
  MEDIA_VARIANT_ROLE_FULL = 3;
}

// StickerFormat identifies the file format of a sticker image.
enum StickerFormat {
  // Unspecified or unknown format.
  STICKER_FORMAT_UNSPECIFIED = 0;
  // WebP container; may be static or animated as declared separately.
  STICKER_FORMAT_WEBP = 1;
  // Animated Lottie-based TGS archive.
  STICKER_FORMAT_TGS = 2;
  // Video (WebM) sticker.
  STICKER_FORMAT_WEBM = 3;
  // Static PNG image.
  STICKER_FORMAT_PNG = 4;
}

// StickerKind identifies how an asset is used, independently of its format.
enum StickerKind {
  // Invalid when authoring an asset; no kind filter when querying assets.
  STICKER_KIND_UNSPECIFIED = 0;
  // Standalone message sticker.
  STICKER_KIND_STICKER = 1;
  // Inline custom emoji, referenced by asset ID with plain-text fallback.
  STICKER_KIND_CUSTOM_EMOJI = 2;
}

// ImageFormat identifies the encoded container, not its animation behavior.
enum ImageFormat {
  // Format was not declared.
  IMAGE_FORMAT_UNSPECIFIED = 0;
  // Static PNG; APNG is not accepted by STRICT_LOSSLESS version 1.
  IMAGE_FORMAT_PNG = 1;
  // Static or animated WebP; consult ImageMetadata.animated.
  IMAGE_FORMAT_WEBP = 2;
}

// MediaValidationProfile selects a fixed validation rule set, not transcoding.
enum MediaValidationProfile {
  // Invalid when explicitly supplied for typed media authoring.
  MEDIA_VALIDATION_PROFILE_UNSPECIFIED = 0;
  // Only static PNG and lossless WebP. WebP image/frame payloads must use VP8L,
  // never lossy VP8; format alone does not prove losslessness. TGS, WebM, APNG,
  // unknown containers are rejected. GIF is a client input
  // format only: normalize to supported lossless bytes before upload, preserving
  // animation unless the user explicitly chooses a still frame. Servers neither
  // transcode mains nor silently flatten animation or substitute lossy media.
  // Sticker/custom-emoji/profile-photo domain bounds apply in addition.
  MEDIA_VALIDATION_PROFILE_STRICT_LOSSLESS = 1;
  // General image main: static PNG or static/animated lossless WebP, at most
  // 10,000,000 bytes, with positive width and height each at most 10,000 pixels.
  // WebP frame payloads use VP8L, never lossy VP8. Automatic main-image resizing
  // is permitted to meet both byte and dimension bounds, preserving aspect ratio
  // without upscaling. Losslessness refers to encoding the final resized pixels,
  // not retaining the original resolution. Clients upload the normalized main.
  // Animation is preserved in lossless WebP unless the user makes an explicit still
  // choice; no automatic flattening. These are main
  // output bounds, not permission to bypass tighter domain-specific limits.
  MEDIA_VALIDATION_PROFILE_IMAGE = 2;
  // General video main: MP4 containing H.264, 8-bit 4:2:0 video and optional
  // AAC-LC audio, with no other media tracks. Display dimensions after rotation
  // have long edge at most 1920 and short edge at most 1080, both positive.
  // Clients preserve aspect ratio, do not upscale, and keep the source frame rate
  // unchanged while normalizing before upload. Servers verify the output codec,
  // tracks, pixel format, display bounds and positive duration from the bytes;
  // source frame rate and user intent are client processing obligations, not
  // facts provable from the output alone. No bitrate or frame-rate conversion is
  // implied. Resource/transfer limits remain deployment policy.
  MEDIA_VALIDATION_PROFILE_VIDEO = 3;
  // General audio main: audio-only MP4/M4A with AAC-LC, positive duration and
  // no video track. Clients normalize and upload; servers validate stored bytes.
  MEDIA_VALIDATION_PROFILE_AUDIO = 4;
  // Recorded voice main: the same audio-only MP4/M4A AAC-LC rules as AUDIO,
  // with voice-message purpose retained independently of other audio.
  MEDIA_VALIDATION_PROFILE_VOICE = 5;
}

// MediaValidation identifies a fixed, versioned validation result or input claim.
// Version 1 is defined independently for each profile above. The explicit source
// purpose selects the required profile, not a file name, MIME type or sniffed type.
// General sources may omit metadata/validation claims; servers still apply the
// purpose's version 1 policy. Strict asset/profile sources require the declaration.
// All typed media require fully decodable, bounded files; supplied physical
// format, dimensions, animation, duration and frame count must match the bytes.
// Reject malformed/truncated containers, trailing data, unknown versions and
// unsupported or purpose-mismatched profiles, never silently downgrade. Servers
// measure physical facts and publish the applied profile/version in metadata;
// client inputs remain untrusted claims. Opaque descriptive text and waveform
// data remain client-supplied, not measured assertions. These rules apply at
// authoring, not raw upload completion, which publishes only immutable storage facts.
//
// Thumbnail policy, version 1: before publication of any owning message, album,
// chat photo, profile entry or asset version, required thumbnails must be durably
// completed and published atomically with that object's main reference, measured
// metadata and variants. A failure leaves that object unpublished; no placeholder
// file IDs, pending variants or successful source acceptance followed by generation.
// Servers derive required static PNG/lossless WebP thumbnails from the accepted
// main bytes (a representative animation/video frame), preserve aspect ratio
// with integer-pixel rounding, never upscale, and use strictly fewer pixels than
// the main display image/frame.
// A 1-pixel main has no lower-pixel thumbnail and is exempt from that requirement.
// Already validated server-generated thumbnails for the same immutable main,
// purpose and profile/version may be reused; no new variant identity is required.
// If derived from an explicit cover/preview input, reuse also requires matching
// immutable cover/preview inputs; matching the main alone is insufficient.
// Required thumbnails have exactly one THUMBNAIL role per main; optional ones
// have at most one. PREVIEW and FULL variants are not accepted by version 1.
// Purpose-specific thumbnail bounds (positive dimensions and at most 256 KiB):
//   - Message photo/video: required, at most 320x320.
//   - Chat/profile photo: required, at most 160x160.
//   - Sticker: required, at most 128x128; custom emoji: optional, at most 128x128.
//   - Audio cover and raw document: optional, at most 320x320; voice: none.
// Optional thumbnails are generated by the server from an explicit cover/preview
// input and are ready under the same publication rule. They preserve aspect ratio
// without upscaling; image-purpose thumbnails also have fewer pixels than the main.
// Audio/raw-document covers have no main display dimensions to compare against.
// Raw documents are not inspected to select media purpose or automatically create
// previews. An optional cover/preview is an explicit input, never inferred from
// document bytes.
// Domain bounds on supplied thumbnail inputs also apply. Client thumbnail inputs
// do not replace server derivation of required thumbnails. Publication exposes
// only final measured variants; it need not echo input variant file IDs.
message MediaValidation {
  // Purpose-specific profile claimed by the client or verified by the server.
  MediaValidationProfile profile = 1;
  // Exact rule-set version; only 1 is defined, zero is invalid.
  uint32 version = 2;
}

// AssetReference pins one immutable sticker/custom-emoji version. Both fields
// must be positive; version zero never means "head". ID-only head discovery uses
// GetStickerAssetsRequest.asset_ids and returns the exact version it resolved.
// Consumers bind/send the returned pair, never substitute a later catalog head.
message AssetReference {
  // Canonical unified asset ID, not a file ID.
  int64 asset_id = 1;
  // Exact immutable version of files, metadata and fallback text.
  uint64 asset_version = 2;
}

// ImageMetadata describes an image attachment.
message ImageMetadata {
  // Image width in pixels; must be greater than zero.
  uint32 width = 1;
  // Image height in pixels; must be greater than zero.
  uint32 height = 2;
  // Whether the image is animated; measured from bytes in returned metadata.
  // Applies to PhotoSource and the image attribute of DocumentSource.
  bool animated = 3;
  // Encoded format, independent of animated; required for profile-photo sources.
  ImageFormat format = 4;
  // Applied IMAGE policy, or STRICT_LOSSLESS for profile photos; verified in
  // server results. Required as an input declaration for profile-photo authoring.
  MediaValidation validation = 5;
}

// VideoMetadata describes a video attachment.
message VideoMetadata {
  // Display width in pixels after applying rotation metadata.
  uint32 width = 1;
  // Display height in pixels after applying rotation metadata.
  uint32 height = 2;
  // Duration in milliseconds; must be greater than zero.
  uint64 duration_ms = 3;
  // Codec claim on input; server-measured codec identifier ("h264") on output.
  optional string codec = 4;
  // Whether the file supports progressive download and playback before the
  // whole file is present on the client.
  bool supports_streaming = 5;
  // Whether this is a round (circular) video note.
  bool round_video = 6;
  // VIDEO version 1 policy; input claims are optional, server results report it.
  MediaValidation validation = 7;
}

// AudioMetadata describes an audio attachment or voice message.
message AudioMetadata {
  // Duration in milliseconds; must be greater than zero.
  uint64 duration_ms = 1;
  // Track title, if declared.
  optional string title = 2;
  // Performer or artist, if declared.
  optional string performer = 3;
  // Marks the audio as a recorded voice message. Voice messages render
  // inline with playback controls and may be auto-transcribed by clients.
  bool voice_message = 4;
  // Client-encoded waveform for inline voice rendering. Opaque to the
  // server; the encoding is a small client-defined sequence of amplitude
  // values.
  optional bytes waveform = 5;
  // AUDIO or VOICE version 1 according to purpose; server-measured validation
  // result on output. Input declarations are optional, never authoritative.
  MediaValidation validation = 6;
}

// StickerMetadata describes a sticker image independently of pack ownership,
// mask positions, and pack membership, which stay in the sticker domain.
message StickerMetadata {
  // Emojis associated with the sticker, as a single concatenated string.
  string emoji = 1;
  // Sticker width in pixels.
  uint32 width = 2;
  // Sticker height in pixels.
  uint32 height = 3;
  // Encoded format, independent of animation. STRICT_LOSSLESS version 1 accepts
  // PNG and WebP only; the other declared formats do not satisfy that profile.
  StickerFormat format = 4;
  // Whether the asset animates; lossless WebP can be static or animated.
  bool animated = 5;
  // Required for animation: total loop duration in milliseconds, 1..3000.
  // Must be absent for static assets. Frames must have positive durations.
  optional uint64 duration_ms = 6;
  // Required for animation: 2..180 frames; absent for static assets.
  optional uint32 frame_count = 7;
  // Required on authored assets and their returned metadata.
  MediaValidation validation = 8;
}

// MediaAttribute is one typed attribute of a document-like attachment.
// Explicit attributes select purpose and validation as defined by DocumentSource.
// At most one attribute of each kind is accepted per attachment; duplicates and
// incompatible purposes/profiles are rejected, not silently reclassified.
message MediaAttribute {
  oneof kind {
    // The document is an image of the described dimensions.
    ImageMetadata image = 1;
    // The document is a video with the described properties.
    VideoMetadata video = 2;
    // The document is audio with the described properties.
    AudioMetadata audio = 3;
    // The document is a sticker with the described properties. Pack
    // ownership and mask positions stay in the sticker domain.
    StickerMetadata sticker = 4;
  }
}

// MediaVariant is a server-published alternative representation of a
// completed file, such as a server-generated thumbnail ready with its owner.
// Variant file IDs are canonical file references and must pass the same
// access checks as the parent file before use. Image dimensions are always
// measured and reported for published thumbnails, not copied from input claims.
message MediaVariant {
  // Role this variant plays for its parent media attachment.
  MediaVariantRole role = 1;
  // Canonical file ID of the completed variant bytes.
  int64 file_id = 2;
  // Image width in pixels, for image variants.
  optional uint32 width = 3;
  // Image height in pixels, for image variants.
  optional uint32 height = 4;
}

// MediaVariantSource references an uploaded, completed variant file that a
// client supplies when building a media attachment. The referenced file must
// be accessible to the caller; variant references are access-checked like
// any other file reference. This is an optional processing input, not an
// authoritative output or a way to avoid required server thumbnail generation.
// Version 1 permits at most one static PNG/lossless WebP THUMBNAIL input under
// the owning purpose's size/dimension bounds; validate its decoded bytes and
// reject mismatched claims or unsupported roles. Width and height are required
// for supplied image inputs. Voice accepts none. The server derives the final
// thumbnail before owner publication and reports its measured dimensions.
message MediaVariantSource {
  // Canonical file ID of the uploaded, completed variant file.
  int64 file_id = 1;
  // Role this variant plays for the attachment being built.
  MediaVariantRole role = 2;
  // Client-asserted image width in pixels, for image variants.
  optional uint32 width = 3;
  // Client-asserted image height in pixels, for image variants.
  optional uint32 height = 4;
}
