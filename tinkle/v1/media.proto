// Media Types — Shared media metadata, attributes, and thumbnails.
//
// Contains the typed media metadata and thumbnail vocabulary shared by
// the file-transfer and messaging contracts. Everything here describes
// application-level media; authoritative storage facts about the underlying
// bytes live in FileInfo (files.proto).
//
// Naming conventions used across tinkle.v1:
//   - `*Metadata` messages and `MediaAttribute` describe media content.
//     Metadata supplied by clients is an explicit claim, never a server
//     verification. Returned physical facts and validation results are
//     server-measured from the completed bytes, never copied as authority.
//   - `Thumbnail` is a server-published completed thumbnail linked by its owner.
//   - `ThumbnailSource` is an optional client-supplied completed thumbnail
//     input; omission never gates acceptance of validated mains.
// MediaValidation versions describe main bytes, not an opt-in lifecycle.
syntax = "proto3";

package tinkle.v1;

option go_package = "github.com/tinklehq/tinkle-proto/tinkle/v1;tinklev1";

// InlinePreview is an optional, self-contained static JPEG presentation hint,
// never a main file, regular thumbnail, validation result or file access grant.
// Both axes are 1..40 pixels and jpeg is 1..4096 bytes. Servers require a fully
// decoded single JPEG image with dimensions exactly matching width/height,
// no trailing bytes, and bounded decoder work; reject malformed/oversized input.
// Clients preserve aspect ratio without upscaling when creating the preview.
// Preview absence is valid. It never substitutes for validating the main bytes.
// Accepted bytes are retained with the owning object and share its visibility;
// they are not a separate file ID and carry no encryption options.
message InlinePreview {
  // Decoded width in pixels, 1..40 inclusive.
  uint32 width = 1;
  // Decoded height in pixels, 1..40 inclusive.
  uint32 height = 2;
  // Complete static JPEG bytes, 1..4096 bytes inclusive.
  bytes jpeg = 3;
}

// MediaProcessingIntent explicitly requests asynchronous inspection of completed
// main bytes. It is not inferred from MIME/name, not permission to transcode a
// main, and not a validation result. Omit for raw documents, audio and voice.
enum MediaProcessingIntent {
  // Invalid when explicitly supplied; omission means no processing intent.
  MEDIA_PROCESSING_INTENT_UNSPECIFIED = 0;
  // Image inspection, including strict image purposes selected by the owner.
  MEDIA_PROCESSING_INTENT_IMAGE = 1;
  // Video inspection and optional representative-frame thumbnail generation.
  MEDIA_PROCESSING_INTENT_VIDEO = 2;
}

// StickerFormat identifies the file format of a sticker image.
enum StickerFormat {
  // Unspecified or unknown format.
  STICKER_FORMAT_UNSPECIFIED = 0;
  // WebP container; may be static or animated as declared separately.
  STICKER_FORMAT_WEBP = 1;
  // Animated Lottie-based TGS archive.
  STICKER_FORMAT_TGS = 2;
  // Video (WebM) sticker.
  STICKER_FORMAT_WEBM = 3;
  // Static PNG image.
  STICKER_FORMAT_PNG = 4;
}

// StickerKind identifies how an asset is used, independently of its format.
enum StickerKind {
  // Invalid when authoring an asset; no kind filter when querying assets.
  STICKER_KIND_UNSPECIFIED = 0;
  // Standalone message sticker.
  STICKER_KIND_STICKER = 1;
  // Inline custom emoji, referenced by asset ID with plain-text fallback.
  STICKER_KIND_CUSTOM_EMOJI = 2;
}

// ImageFormat identifies the encoded container, not its animation behavior.
enum ImageFormat {
  // Format was not declared.
  IMAGE_FORMAT_UNSPECIFIED = 0;
  // Static PNG; APNG is not accepted by STRICT_LOSSLESS version 1.
  IMAGE_FORMAT_PNG = 1;
  // Static or animated WebP; consult ImageMetadata.animated.
  IMAGE_FORMAT_WEBP = 2;
}

// MediaValidationProfile selects a fixed validation rule set, not transcoding.
enum MediaValidationProfile {
  // Invalid when explicitly supplied for typed media authoring.
  MEDIA_VALIDATION_PROFILE_UNSPECIFIED = 0;
  // Only static PNG and lossless WebP. WebP image/frame payloads must use VP8L,
  // never lossy VP8; format alone does not prove losslessness. TGS, WebM, APNG,
  // unknown containers are rejected. GIF is a client input
  // format only: normalize to supported lossless bytes before upload, preserving
  // animation unless the user explicitly chooses a still frame. Servers neither
  // transcode mains nor silently flatten animation or substitute lossy media.
  // Sticker/custom-emoji/profile-photo domain bounds apply in addition.
  MEDIA_VALIDATION_PROFILE_STRICT_LOSSLESS = 1;
  // General image main: static PNG or static/animated lossless WebP, at most
  // 10,000,000 bytes, with positive width and height each at most 10,000 pixels.
  // WebP frame payloads use VP8L, never lossy VP8. Automatic main-image resizing
  // is permitted to meet both byte and dimension bounds, preserving aspect ratio
  // without upscaling. Losslessness refers to encoding the final resized pixels,
  // not retaining the original resolution. Clients upload the normalized main.
  // Animation is preserved in lossless WebP unless the user makes an explicit still
  // choice; no automatic flattening. These are main
  // output bounds, not permission to bypass tighter domain-specific limits.
  MEDIA_VALIDATION_PROFILE_IMAGE = 2;
  // General video main: MP4 containing H.264, 8-bit 4:2:0 video and optional
  // AAC-LC audio, with no other media tracks. Display dimensions after rotation
  // have long edge at most 1920 and short edge at most 1080, both positive.
  // Clients preserve aspect ratio, do not upscale, and keep the source frame rate
  // unchanged while normalizing before upload. Servers verify the output codec,
  // tracks, pixel format, display bounds and positive duration from the bytes;
  // source frame rate and user intent are client processing obligations, not
  // facts provable from the output alone. No bitrate or frame-rate conversion is
  // implied. Resource/transfer limits remain deployment policy.
  MEDIA_VALIDATION_PROFILE_VIDEO = 3;
  // General audio main: audio-only MP4/M4A with AAC-LC, positive duration and
  // no video track. Clients normalize and upload; servers validate stored bytes.
  MEDIA_VALIDATION_PROFILE_AUDIO = 4;
  // Recorded voice main: the same audio-only MP4/M4A AAC-LC rules as AUDIO,
  // with voice-message purpose retained independently of other audio.
  MEDIA_VALIDATION_PROFILE_VOICE = 5;
}

// MediaValidation identifies a fixed, versioned validation result or input claim.
// Version 1 is defined independently for each profile above. The explicit source
// purpose selects the required profile, not a file name, MIME type or sniffed type.
// General sources may omit metadata/validation claims; servers still apply the
// purpose's version 1 policy. Strict asset/profile sources require the declaration.
// All typed media require fully decodable, bounded files; supplied physical
// format, dimensions, animation, duration and frame count must match the bytes.
// Reject malformed/truncated containers, trailing data, unknown versions and
// unsupported or purpose-mismatched profiles, never silently downgrade. Servers
// measure physical facts and publish the applied profile/version in metadata;
// client inputs remain untrusted claims. Opaque descriptive text and waveform
// data remain client-supplied, not measured assertions. These rules apply at
// authoring, not raw upload completion, which publishes only immutable storage facts.
//
// Thumbnail policy: every thumbnail is optional enrichment. Validate main bytes
// independently of generated sizes; missing or failed generation never blocks or
// reverses acceptance. Supplied inputs are separate completed files, validated
// before acceptance and adopted under their exact IDs; never silently discard an
// invalid supplied input. At most one static PNG/lossless WebP thumbnail per main,
// positive dimensions, at most 256 KiB. Bounds:
//   - Message photo/video, audio cover and raw document preview: at most 320x320.
//   - Chat/profile photo: at most 160x160.
//   - Sticker/custom emoji: at most 128x128.
//   - Voice: no thumbnail or inline preview.
// Preserve aspect ratio with integer-pixel rounding, never upscale, and use fewer
// pixels than an image/video main display frame. A 1-pixel main has no thumbnail.
// Audio/raw-document covers have no main display dimensions to compare against;
// their explicit supplied inputs are validated, never derived by sniffing mains.
// Automatic generation is limited to explicitly typed images and video frames
// with matching upload processing_intent. The asynchronous worker inspects only
// image/video, never audio/voice, and produces no video output or main transcode.
// Reuse of generated thumbnails requires the same immutable main, purpose,
// profile/version and any explicit cover inputs. Do not replace an adopted input.
//
// New result projections carry a positive representation_revision, initially 1.
// A later durably completed thumbnail is attached atomically by the owning domain,
// incrementing only that independent revision, never main file identity/bytes,
// physical metadata, authored preview, body_revision, edit_date, asset_version,
// gallery_revision or pack_revision. Equal revisions describe identical complete
// representation sets. Compare revisions only for the same principal, owning
// reference/version and immutable main; never merge across a main replacement.
// Source replacement/removal fences stale worker completions. Membership is
// exact per-output membership, never all children of an uploaded main. Generated
// output existence alone grants no read; only an explicit durable owner link does.
// Older captures have absent representation_revision and stay frozen: do not
// enrich them or widen their captured file grants. Sending an existing asset pins
// its exact main/version and explicitly captures its current output membership;
// future asset enrichment does not implicitly enrich that message capture.
// A new message can capture an older asset without modifying that asset. Reusing
// a retained profile entry does not retrofit its source or representation policy.
//
// Pending lifecycle rules for ordinary SendMedia/SendAlbum, EditChatPhoto,
// channel EditPhoto, SetProfilePhoto and Create/UpdateStickerAsset: no separate
// submission is needed. Only explicit image/video inspection may wait for the
// asynchronous worker. Other purposes validate without that worker. Scheduled
// sends and message edits do not use these pending lifecycles; validate their
// mains before existing scheduling/edit acceptance, with optional thumbnails.
// Persist the authenticated actor, original method/scope, exact original request
// bytes, keys, immutable sources/claims, preview/thumbnail, captions/entities/reply,
// options, original CAS and draft pair before returning PENDING. Clients persist
// and retry exact bytes; bindings preserve the original method payload unchanged.
// Reject unknown fields recursively before binding. A fingerprint is internal,
// never a public field or content lookup. Keys bind one method/scope/request;
// conflicting reuse has no effect and syntactic rejection consumes no key.
// Recover an existing binding before evaluating fresh CAS/source preconditions;
// a terminal retry never reapplies the mutation or fails merely due to its old CAS.
// PENDING/PROCESSING have no recipient-visible acceptance, history, file grant,
// source mutation, fanout or draft clear. Workers never substitute their own
// principal, a new source/head or refreshed CAS/draft tokens. At final commit,
// recheck current authorization, file access, main and supplied input validation,
// reply/entity/catalog references, original CAS and domain bounds. Albums commit
// all-or-nothing. Success, deduplication, accepted identities, owning mutation,
// exact file membership and durable change/draft obligations commit atomically.
// Clear only the captured draft pair on acceptance, never a newer draft.
// Each family has actor-private Get/Cancel methods, with unknown/foreign/mismatched
// or expired non-successful identities reporting NOT_FOUND alike. PENDING may
// become PROCESSING or terminal; PROCESSING may become terminal. Terminal states
// never change. Cancel unclaimed PENDING work durably before responding, racing
// claim/commit atomically. Return a terminal state or claimed PROCESSING, never
// PENDING as a cancellation acknowledgement. Claimed work may report PROCESSING,
// not cancellation or rollback. Query until terminal.
// Cancellation never aborts uploads or deletes accepted objects. RPC cancellation
// or a deadline proves no durable outcome. Pending records survive restarts and
// replica changes and cannot be evicted. Retain full terminal outcomes at least
// 30 days from termination; retain deduplication tombstones indefinitely, including
// exact request binding and successful accepted identities, queryable even after
// full-body retention or source edits/removal. Expiry never permits key reuse.
// Recheck identity-disclosure policy on every submit/query/cancel. Success always
// includes explicit reference_withheld decisions; absence is unknown/nonconforming.
// Ordinary edits/removal do not erase receipts. Withholding omits sensitive IDs,
// never changes durable success or its revision. Receipts grant no current body or
// file access. Optional results require current authorization and the original
// matching authored source/revision; omit removed, edited or superseded bodies,
// never resurrect them or substitute current heads. Later representations of the
// same original main may hydrate. Fetch current source separately to reconcile.
message MediaValidation {
  // Purpose-specific profile claimed by the client or verified by the server.
  MediaValidationProfile profile = 1;
  // Exact rule-set version; only 1 is defined, zero is invalid.
  uint32 version = 2;
}

// AssetReference pins one immutable sticker/custom-emoji version. Both fields
// must be positive; version zero never means "head". ID-only head discovery uses
// GetStickerAssetsRequest.asset_ids and returns the exact version it resolved.
// Consumers bind/send the returned pair, never substitute a later catalog head.
message AssetReference {
  // Canonical unified asset ID, not a file ID.
  int64 asset_id = 1;
  // Exact immutable version of files, metadata and fallback text.
  uint64 asset_version = 2;
}

// ImageMetadata describes an image attachment.
message ImageMetadata {
  // Image width in pixels; must be greater than zero.
  uint32 width = 1;
  // Image height in pixels; must be greater than zero.
  uint32 height = 2;
  // Whether the image is animated; measured from bytes in returned metadata.
  // Applies to PhotoSource and the image attribute of DocumentSource.
  bool animated = 3;
  // Encoded format, independent of animated; required for profile-photo sources.
  ImageFormat format = 4;
  // Applied IMAGE policy, or STRICT_LOSSLESS for profile photos; verified in
  // server results. Required as an input declaration for profile-photo authoring.
  MediaValidation validation = 5;
}

// VideoMetadata describes a video attachment.
message VideoMetadata {
  // Display width in pixels after applying rotation metadata.
  uint32 width = 1;
  // Display height in pixels after applying rotation metadata.
  uint32 height = 2;
  // Duration in milliseconds; must be greater than zero.
  uint64 duration_ms = 3;
  // Codec claim on input; server-measured codec identifier ("h264") on output.
  optional string codec = 4;
  // Whether the file supports progressive download and playback before the
  // whole file is present on the client.
  bool supports_streaming = 5;
  // Whether this is a round (circular) video note.
  bool round_video = 6;
  // VIDEO version 1 policy; input claims are optional, server results report it.
  MediaValidation validation = 7;
}

// AudioMetadata describes an audio attachment or voice message.
message AudioMetadata {
  // Duration in milliseconds; must be greater than zero.
  uint64 duration_ms = 1;
  // Track title, if declared.
  optional string title = 2;
  // Performer or artist, if declared.
  optional string performer = 3;
  // Marks the audio as a recorded voice message. Voice messages render
  // inline with playback controls and may be auto-transcribed by clients.
  bool voice_message = 4;
  // Client-encoded waveform for inline voice rendering. Opaque to the
  // server; the encoding is a small client-defined sequence of amplitude
  // values.
  optional bytes waveform = 5;
  // AUDIO or VOICE version 1 according to purpose; server-measured validation
  // result on output. Input declarations are optional, never authoritative.
  MediaValidation validation = 6;
}

// StickerMetadata describes a sticker image independently of pack ownership,
// mask positions, and pack membership, which stay in the sticker domain.
message StickerMetadata {
  // Emojis associated with the sticker, as a single concatenated string.
  string emoji = 1;
  // Sticker width in pixels.
  uint32 width = 2;
  // Sticker height in pixels.
  uint32 height = 3;
  // Encoded format, independent of animation. STRICT_LOSSLESS version 1 accepts
  // PNG and WebP only; the other declared formats do not satisfy that profile.
  StickerFormat format = 4;
  // Whether the asset animates; lossless WebP can be static or animated.
  bool animated = 5;
  // Required for animation: total loop duration in milliseconds, 1..3000.
  // Must be absent for static assets. Frames must have positive durations.
  optional uint64 duration_ms = 6;
  // Required for animation: 2..180 frames; absent for static assets.
  optional uint32 frame_count = 7;
  // Required on authored assets and their returned metadata.
  MediaValidation validation = 8;
}

// MediaAttribute is one typed attribute of a document-like attachment.
// Explicit attributes select purpose and validation as defined by DocumentSource.
// At most one attribute of each kind is accepted per attachment; duplicates and
// incompatible purposes/profiles are rejected, not silently reclassified.
message MediaAttribute {
  oneof kind {
    // The document is an image of the described dimensions.
    ImageMetadata image = 1;
    // The document is a video with the described properties.
    VideoMetadata video = 2;
    // The document is audio with the described properties.
    AudioMetadata audio = 3;
    // The document is a sticker with the described properties. Pack
    // ownership and mask positions stay in the sticker domain.
    StickerMetadata sticker = 4;
  }
}

// Thumbnail is a durably ready static PNG/lossless WebP thumbnail explicitly
// linked by its owner under MediaValidation's purpose bounds. File reads require
// current authorization and exact output membership, just like the main file.
// When this message is present all fields must be positive. Dimensions are
// server-measured, never copied as authority from input claims. This file is
// separate from InlinePreview's tiny JPEG bytes.
message Thumbnail {
  // Positive canonical file ID of the completed thumbnail bytes.
  int64 file_id = 1;
  // Measured image width in pixels; must be greater than zero.
  uint32 width = 2;
  // Measured image height in pixels; must be greater than zero.
  uint32 height = 3;
}

// ThumbnailSource references one uploaded, completed caller-owned thumbnail.
// This optional processing input is not an authoritative output. When present,
// file_id, width and height must all be positive; zero/missing dimensions are
// invalid, not omission. Validate decoded static PNG/lossless WebP bytes under
// MediaValidation's purpose bounds and reject mismatched claims. Voice accepts
// none. Access-check and adopt the exact validated file ID, reporting measured
// dimensions. Omission never blocks main acceptance or requires generation.
// This is separate from InlinePreview bytes.
message ThumbnailSource {
  // Positive canonical file ID of the uploaded, completed thumbnail file.
  int64 file_id = 1;
  // Client-asserted image width in pixels; must be greater than zero.
  uint32 width = 2;
  // Client-asserted image height in pixels; must be greater than zero.
  uint32 height = 3;
}
